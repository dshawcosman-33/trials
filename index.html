function openTutorial(auto){
  if(!P)return;
  const keep=(S&&!S.over)?{nodes:[...story.childNodes],act}:null;
  let i=0;
  const exit=()=>{
    P.tut=1;saveP();
    if(keep){story.innerHTML="";keep.nodes.forEach(n=>story.append(n));act=keep.act;renderAll();}
    else title();
  };
  const show=()=>{
    story.innerHTML="";
    const wrap=el("div","tut");
    wrap.append(el("div","pg",`How to Play &middot; Page ${i+1} of ${TUT.length}`));
    const body=el("div","");TUT[i](body);wrap.append(body);
    const nav=el("div","act");nav.style.marginTop="12px";
    if(i<TUT.length-1)nav.append(btn("Next",()=>{i++;show();}));
    else nav.append(btn(keep?"Back to my run":"Start playing",exit,"coral"));
    if(i>0)nav.append(btn("Back",()=>{i--;show();},"grey"));
    if(i<TUT.length-1)nav.append(btn(auto?"Skip tutorial":"Close tutorial",exit,"grey small"));
    wrap.append(nav);story.append(wrap);act=nav;story.scrollTop=0;
  };
  show();
}

/* --- narr_01_day1.js --- */
/* ============ NARRATIVE: Day 1 main events ============ */
/* Each event: l = full text (first time seen), s = short reminder, o = outcomes per choice [pass, fail, (critical fail)] */
const V=(id,l,s,o)=>{NARR.ev[id]={l,s,o};};

/* ----- Day 1 standard ----- */
V("D1-DEP-A",
"The Depot is a giant glass dome in the middle of the Basin, filled with tall stacks of supply crates. Control, the voice that runs the Trials, has just announced that the Overseers have dropped fresh supplies, and contenders are already crowding in. Near the middle of the room, three of them are arguing over one half-open crate.\n\nThe crate is close enough to grab, but the crowd is thick and every shove makes noise. You could dive in, try to make a deal, or slip out a side ramp before anyone notices you.",
"Three contenders argue over a half-open crate in the Depot dome. You can dive in, trade, or slip out a side ramp.",
[["You duck under an elbow, slide across the polished floor and grab the crate's handle. Something useful rattles inside, and you are out of the crowd before anyone can stop you.",
  "You are a half step too slow. A shoulder knocks you sideways and the crate disappears into the crowd. A few heads turn toward the noise you made.",
  "You trip over a loose strap and crash into a stack of crates. Everything tumbles, and a nearby contender spots you at once and tags your band. It flashes red!"],
 ["You stay calm and offer a fair swap. A tired contender nods, and the two of you agree on a trade.",
  "Nobody wants to deal while the crowd is shouting. You walk away with nothing but a few strange looks."],
 ["You spot a ramp at the edge of the dome and slide down it. Nobody sees you go, and the noise of the crowd fades behind you.",
  "You make it out the side ramp, but a loose metal panel clangs loudly under your feet. Heads turn as you disappear."]]);

V("D1-DEP-B",
"Evening settles over the Depot. The glass dome turns orange, then purple, and rivals begin to find sleeping spots among the crates. They whisper to each other and watch the tunnels. It is warm inside, but it is also loud, and you can tell that anyone sleeping here will be easy to find.\n\nBelow the main floor, a maze of supply tunnels leads away from the dome. A tired contender sits near the entrance, rubbing their feet. You could hide in the tunnels, share what you know with them, or leave for the quiet of Whisper Pines before it gets dark.",
"Dusk in the Depot. It is warm but loud, and rivals are settling in. You could camp in the tunnels, trade information, or leave for the Pines.",
[["You find a dusty corner deep in the tunnels, far from any lamp. You pull a crate across the entrance and sleep soundly. In the morning you notice one more thing tucked behind a pipe.",
  "You pick a spot that seems quiet, but your footsteps echo down the tunnel. Rivals hear you and gather at the far end. You stay awake most of the night."],
 ["You sit beside the tired contender and swap stories. They share a bit of water and mention something they noticed about another contender.",
  "You start a friendly talk, but the contender only sighs and says nothing useful. Your voice carries across the room."],
 ["You take the ramp out into the cool evening air. The Pines are close, and you settle in among the trees before dark.",
  "You rush out into the dusk and kick over a stack of cans on your way. The clatter follows you all the way to the trees."]]);

V("D1-PIN-A",
"Whisper Pines is a thick forest of tall, dark trees, and the ground is soft with fallen needles. As you pass between the roots, you notice a line of simple traps, called snares, stretched along the trail. Another contender must have set them earlier and then moved on.\n\nSnares can catch small animals for food, but fiddling with them takes time and makes sounds. You could reset the line and check it, take only the useful cord, or leave everything alone and move on quietly.",
"A line of old snares runs along the trail in Whisper Pines. You could reset them, take the cord, or leave them.",
[["You check each loop and tighten the knots, working slowly. By the time you reach the end of the line, something small is caught, and you also learn that these woods hide more snares than you expected.",
  "You tug a knot too hard and the whole line snaps loose. The branches whip back with a crack that echoes between the trees."],
 ["You unwind a strong length of cord from the end of the line and coil it around your wrist. It will be useful for climbing or camping."],
 ["You step carefully around the snares and keep walking. Not a single twig snaps under your feet."]]);

V("D1-PIN-B",
"Night is close. In the last orange light, you find a huge fallen tree. The trunk is hollow, and the inside is dry and sheltered. It is almost like a ready-made shelter, but the opening is wide and it would need work before it could keep out the cold.\n\nYou are tired. You could build up the hollow, climb into the branches overhead, or keep walking by moonlight and hope to find a better spot.",
"A hollow fallen log offers shelter as night falls. You could build it up, sleep in a tree, or keep moving.",
[["You stack branches and pile needles around the opening until the hollow is snug. You crawl in and fall asleep warm and dry.",
  "You try to build up the shelter, but the branches keep sliding. In the end you give up and curl up in the hollow. It is a cold, restless night."],
 ["You climb into a thick fork of branches and tie yourself in with your belt. The tree sways gently, and you sleep better than you expected.",
  "You slip in the dark and have to climb down. You spend the night on hard ground, sore and cold.",
  "A branch snaps under you. You fall right beside a hiding rival, who tags your band before you can stand up. It flashes red!"],
 ["The moon is bright enough to see by. You pick your way between the trunks to a new spot and settle in.",
  "You catch your boot on a root and stumble. The noise carries, and you stay where you are, listening, until things go quiet again."]]);

V("D1-LAK-A",
"Through a gap in the trees you see it: Clearwater Lake, wide and glittering. After a day in the Basin, water has never looked so good. But the sandy shore is open ground with no cover at all, and you notice fresh footprints in the sand, more than one set, going in different directions.\n\nYou could fill up quickly and leave, take a moment to scout the tree line for trouble, or try fishing for a bigger meal.",
"Clearwater Lake glitters beyond the trees, but the shore is open and covered in fresh footprints.",
[["You sprint down the sand, fill your container in a few quick scoops and run back to the trees. Nobody follows.",
  "You dash to the water and fill up, but your footsteps are loud on the wet sand and you splash more than you meant to. Someone could have seen you."],
 ["You crouch in the trees and study the shore. You spot a pair of contenders passing by and overhear something useful. When they are gone, you fill up in peace.",
  "You watch for a while but see nothing clear. You fill your container anyway, and something rustles in the bushes as you leave."],
 ["You tie a hook from a bent pin and a strip of cloth. After a patient wait, a silver fish takes the bait. You eat part of it and drink your fill.",
  "The fish ignore your line. You pull it in empty, and the splashing draws a curious glance from across the water."]]);

V("D1-LAK-B",
"Evening mist rolls off the water and curls around your ankles. The lake is quiet, but voices drift from the far shore, and a small fire flickers in the dark. You are out in the open, and there is little cover on this side.\n\nA sandbar juts into the water nearby, almost like a tiny island. You could camp there, spend your evening cleaning and storing water, or signal to a passing stranger and see if they want to share a camp.",
"Mist and distant voices at Clearwater Lake in the evening. You could camp on a sandbar, purify water, or signal a stranger.",
[["You wade onto the sandbar. The water around you is a natural alarm, because anyone approaching would splash. You sleep deeply and wake rested.",
  "The sandbar is damp and cold. You spend the night shivering and listening to the lapping water."],
 ["You strain the water through cloth, let it settle and seal it in your container. Tomorrow's drink will be safe and clean.",
  "You work for a while, but the water stays cloudy. You decide it will have to do."],
 ["A stranger waves back across the water, then wades over. After a short chat, they agree to team up and share some food.",
  "Your signal is too bright and too obvious. A few voices go quiet across the water, and nobody comes."]]);

V("D1-RID-A",
"Ridgeback is a long, rocky spine rising above the Basin. From here, the trees look like green carpet. A steep climb leads to a narrow ledge that overlooks almost everything. People say that whoever stands on that ledge can see the whole arena and even guess what the Overseers might do next.\n\nThe climb is risky, and the rocks are loose. You could try for the ledge, search the broken rock at the bottom, or simply shelter under an overhang and rest.",
"A steep climb leads to the lookout ledge on Ridgeback. You could climb, search the rubble below, or rest.",
[["You go hand over hand up the rock, testing each hold. At the top you can see the whole Basin, and you notice the marsh below, where the ground looks soft. Something about the water level tells you it will flood tonight. You also catch a glimpse of someone on the trail below.",
  "Halfway up, a stone crumbles under your hand. You slide back to the base, scraped but unhurt.",
  "The ledge breaks under you without warning. You tumble to the bottom, and your band flashes red as the safety system tags you out!"],
 ["You sift through the rubble at the foot of the cliff. Something metal glints between two stones, and you pry it free.",
  "You turn over a few rocks but find only dust. A small avalanche of pebbles clatters down and rolls away."],
 ["You tuck yourself under a ledge of stone and close your eyes. The rock keeps the wind off, and you rest."]]);

V("D1-RID-B",
"The sun sinks and Ridgeback grows cold. You find a deep cave in the rock. It is dry and has a smooth floor. At the very back, there is a strange blue glow, soft and steady, as if something is humming behind the wall.\n\nThe cave is a good place to hide, but the glow is odd. You could camp deep inside, set up near the entrance with a small fire, or investigate the glowing wall.",
"A dry cave on Ridgeback with a strange blue glow at the back. You could camp deep, camp by the entrance, or investigate.",
[["You roll out your things deep in the cave, far from the entrance. The walls hold in warmth. You sleep well and no one finds you.",
  "You settle in, but the cave is colder than it looked. You wake several times and never feel properly rested."],
 ["You build a tiny fire at the mouth of the cave, shielded by a ring of stones. It glows warmly and keeps you cozy through the night.",
  "The fire smokes badly and the glow spills out onto the rocks. You sleep poorly, and you suspect the light was seen from far away."],
 ["You press your hand to the wall. It is warm, and a panel slides open. A small screen shows the Overseers' daily schedule, and you read it carefully before it fades.",
  "You poke at the glowing patch, and an alarm chirps. You flinch and back away as the glow turns red for a moment."]]);

V("D1-MSH-A",
"Mistmarsh is a flat, wet place of black mud, tall reeds and low fog. Your feet sink slightly with each step. In a clearing, you find a thicket of berry bushes, with fat red berries on one side and fat blue berries on the other. You are hungry.\n\nLook closely at the leaves. The leaves on the blue bush grow in groups of three, which is something you may have heard is a warning sign. The red berries look plainer, but they seem safer. You could try either one, or skip the berries completely.",
"A berry thicket in Mistmarsh. The blue bush has leaves in groups of three. Red berries look plainer.",
[["You pick a handful of the blue berries and taste one. It is sweet and juicy, and nothing odd happens. You gather a big pile and eat until you feel full.",
  "You eat a few blue berries. A hot, queasy feeling climbs up your throat, and your recall band starts flashing red. The three-leaf warning was right!"],
 ["You pick the red berries and eat them carefully. They are plain but good, and you feel better right away.",
  "You nibble a few of the red berries. They are sour and mostly seeds, and your stomach is still empty."],
 ["You look at the glossy leaves one last time and decide to walk on. Better to be hungry than sorry."]]);

V("D1-MSH-B",
"Fog thickens until you can barely see your own hands. Pale lights bob in the reeds like tiny floating lanterns, drifting and flickering. They might be marsh gas, or Overseer lights, or something else. The water around you is already creeping higher around your boots.\n\nYou need to sleep, but this is an odd place for it. You could rest on a dry hummock, follow the lights, build a floating raft, or leave the marsh entirely if you know what is coming.",
"Thick fog and floating pale lights in Mistmarsh. You could camp on a hummock, follow the lights, build a raft, or leave the marsh.",
[["You find a dry hump of grass in the fog and curl up on it. The ground is damp but holds firm, and you sleep better than you feared.",
  "You choose a hummock, but it turns out to be soggy. You sleep poorly with wet boots."],
 ["You follow the lights step by step. They lead you to a half-sunken box in the reeds, with a bottle of water inside.",
  "You follow the lights in circles, getting more turned around in the fog. You make a lot of noise sloshing back to where you started.",
  "The lights lead you into a deep mud pool. You sink to your waist and a patrol tags you as you flail. Your band flashes red!"],
 ["You lash reeds into a floating platform and lie down on it. The water laps quietly underneath you, and nobody could find you here. You keep the raft for tomorrow.",
  "The raft keeps tipping and leaking. You give up and sleep sitting upright on a clump of reeds."],
 ["You remember what you learned and walk out of the marsh before the water comes. You find a dry spot to rest well away from the rising tide."]]);

/* ----- Day 1 hard ----- */
V("D1-DEP-AH",
"Without warning, the Overseers drop a huge pile of crates into the middle of the dome. Every contender in the Depot surges toward it at once. The air fills with shouting, boots and the clatter of lids being yanked open.\n\nThis is the moment everyone has been waiting for, and it is also the most dangerous. You could dive into the pile and grab as much as you can, take one crate and roll away, or watch from the ledge and learn who is who.",
"The Overseers drop a pile of crates and the whole dome stampedes toward it.",
[["You dive into the middle and come out with two crates under your arms. You scramble out the other side, breathless, before anyone realizes what you did.",
  "You leap into the crush, and the pile collapses. Hands grab at you from every side and a rival tags your band. It flashes red!"],
 ["You grab the nearest crate and roll away across the floor before anyone can block you. It has something useful inside.",
  "You grab a crate, but a stranger yanks it out of your hands. Several people notice the struggle."],
 ["You climb to the ledge and watch the crowd. You learn how some of the contenders move, speak and treat each other, and make mental notes.",
  "You watch the chaos, but it is too noisy and fast to follow. Someone looks up and sees you on the ledge."]]);

V("D1-DEP-BH",
"A patrol of rivals sweeps through the supply tunnels at dusk. They are checking every corner, flashlights flickering. It is not clear whether they are hunting a specific contender or only searching for easy tags, but the sound of their boots is growing louder.\n\nYou are on their route. You could hide in the crate stacks, slip out through a vent in the wall, or try talking your way past the patrol.",
"A patrol of rivals sweeps the Depot tunnels at dusk, checking every corner.",
[["You crawl between two crate stacks and pull a tarp over yourself. The patrol passes within an arm's length. Once they leave, you sleep where you are, and find something useful behind the crates.",
  "You squeeze into a gap, but your elbow bumps a crate. A flashlight swings over and a patroller reaches in. Your band flashes red!"],
 ["You pry a vent grille loose and slip through the narrow metal tube. It takes a lot of effort, but you pop out at the far end, unseen.",
  "The vent cover is stuck. You wrestle with it, and the noise echoes down the tunnel."],
 ["You step out with your hands raised and speak calmly. The patrol hesitates, lets you pass, and one of them mentions something about another contender.",
  "You start to talk, but they are not in the mood. Suddenly you are in a fight!"]]);

V("D1-PIN-AH",
"The trees go quiet. This part of Whisper Pines has been turned into a trap field. Snares and trip wires crisscross the trail in every direction, some hidden under needles, some in plain sight. Whoever set this up wanted to catch many contenders at once.\n\nOne wrong step could trigger something, and the forest is very still. You could sprint straight through, pick your way carefully, or walk around the edge.",
"A trap field of snares and trip wires fills this part of Whisper Pines.",
[["You take a deep breath and run. Your feet find the gaps, one after another, and you burst out the other side. You choose where to go next.",
  "Your boot catches a hidden wire. A net drops from above and tangles you, and the band on your wrist flashes red!"],
 ["You step carefully, testing the ground with a stick. You find a working trap and also a little food that someone left behind.",
  "You go slowly, but one wire is better hidden than the rest. It snaps, and a clatter of cans echoes through the trees."],
 ["You pick a long way around the edge. It is slow going, and the extra walking leaves you thirstier than before.",
  "You circle around, but lose time and energy fighting through brush. You arrive tired and thirsty."]]);

V("D1-PIN-BH",
"Night is almost here when you find the perfect place to camp. Then you hear a faint buzzing. A swarm of simulated stinging flies has made a nest right there. The Overseers' flies cannot really hurt you, but a swarm still hurts like a thousand small pinches, and the sound will draw rivals.\n\nYou could sleep in the cold stream bed to avoid them, smoke them out, or flee into the dark.",
"A swarm of stinging flies has nested right where you meant to camp.",
[["You wade into the cold stream bed, where the flies will not follow, and lie down under the bank. The water is icy, but you grit your teeth and sleep.",
  "You choose the stream bed, but the flies find you anyway. The swarm covers you, and a rival who hears the commotion tags your band. It flashes red!"],
 ["You build a smoky fire that sends the flies buzzing away. You sleep next to the warmth, though the smoke hangs in the air.",
  "The smoke makes your eyes water but does not drive the flies away. You cough and thrash all night, loudly."],
 ["You grab your things and run into the dark. The buzzing fades behind you, and you find a new spot to rest.",
  "You run, but the flies follow for a while. You crash through brush and arrive noisy and scratched."]]);

V("D1-LAK-AH",
"Four rivals crowd the shoreline of the lake, shoving and splashing as they fight for water. No one wants to leave the lake, and everyone wants to be first. Even from the tree line, you can hear the shouting.\n\nYou are thirsty, and the water is right there. You could rush in, wait for the crowd to thin, or swim along the edge to a quiet cove on the far side.",
"Four rivals crowd the lake shore, fighting for water.",
[["You duck low and sprint into the water. You fill up in an instant and slip away before they react. The commotion makes some of them look up, though.",
  "You rush in, and the crowd closes around you. A rival tags your band as you try to push past. It flashes red!"],
 ["You wait patiently in the trees. One by one, the rivals leave, and you fill up in peace, though you notice that your waiting did not go unnoticed.",
  "You wait too long. A few rivals spot you in the trees and start toward you."],
 ["You wade quietly into the shallows and swim along the edge to a hidden cove. The water is calm and clear, and no one sees you fill up.",
  "The cove is farther than it looked. You get tired and your pack slips, and something floats away."]]);

V("D1-LAK-BH",
"A thick mist covers the lake as evening falls, and a strong current tugs at the shore. A little island sits in the middle, looking safe and hidden. But the water between you and the island is fast and cold, and you cannot see the bottom.\n\nYou could swim across to the island, build a windbreak on the shore, or light a signal fire to attract an ally.",
"Thick mist and a strong current at the lake in the evening.",
[["You swim hard and make the island. It is quiet, hidden by fog, and nobody could find you here. You sleep well.",
  "The current grabs you halfway across. You are carried downstream and a watcher on shore tags your band. It flashes red!"],
 ["You pile driftwood into a curved wall and curl up behind it. The wind drops and you rest well.",
  "The wall falls apart in the wind. You huddle against a log for the night, cold and half awake."],
 ["Your signal fire burns brightly through the mist. A friendly stranger wades over and offers to team up.",
  "The fire is too bright and too loud. Rivals across the lake notice it, and nobody friendly comes."]]);

V("D1-RID-AH",
"The route to the lookout ledge is crumbling. Pieces of rock break away and rattle down the slope with every step. This is no longer an ordinary climb. It is a race against the cliff itself.\n\nYou want to reach the ledge, but you could also try a safer climb through a chimney in the rock, or scout the area from below.",
"The ledge route to the lookout is crumbling under your feet.",
[["You rush upward, taking the steps two at a time before the stone can give way. At the top, the view is huge. You see the marsh and know it will flood tonight, and you spot a contender on the trail below.",
  "The ledge falls away under your feet. You drop, and a safety net catches you. Your band flashes red as you are tagged out."],
 ["You squeeze into a narrow chimney and climb with your back against one wall and feet against the other. It is slow, but it holds. From the top, you can see that the marsh will flood tonight.",
  "The chimney is too tight and your arms give out. You slide down, scraped but unharmed."],
 ["You watch the ridge from below and study how the water flows and where it pools. You work out that the marsh will flood tonight.",
  "You watch the ridge, but dust and distance get in the way. You do not learn anything new."]]);

V("D1-RID-BH",
"The cave roof drips and groans, and small stones fall around you. It is a good place to hide, but the roof might not hold. Every drop of water echoes, and you worry that a single cracked stone could bring down a big piece.\n\nYou could camp deep inside, prop up the roof with branches, or look for a different cave.",
"A dripping, groaning cave roof on Ridgeback. Small stones fall.",
[["You roll out your bedding deep inside, where the stone is thickest. The dripping lulls you to sleep, and the roof holds.",
  "A chunk of ceiling lets go and drops beside you. The safety system flashes your band red and tags you out."],
 ["You wedge branches between the floor and the roof. They creak, but they hold, and you sleep under your own little support beam.",
  "The branches slip, and the roof groans. You decide not to trust it and sit awake until dawn."],
 ["You search the rock and find a better cave a short way along. It is smaller and quieter, and nobody has been here.",
  "You search for a while, but every cave looks wet or crowded. Your search is noisy in the dark."]]);

V("D1-MSH-AH",
"Berries of every colour crowd the bushes of Mistmarsh, and they all look alike: shiny, plump and inviting. You are hungry, and the fog makes everything blur. But some of these are safe and some are not, and it is easy to confuse them.\n\nYou could eat the largest berries, boil leaves into tea, or try fishing in the muddy water.",
"Berries of every colour crowd the bushes, and they all look alike.",
[["You take a careful look at the shapes and shine and choose the largest ones. They are rich and sweet. You fill up, and you also notice how to tell good berries from bad.",
  "You pick the biggest, shiniest berries. Within seconds your stomach lurches, and your band starts flashing red. They were the wrong ones!"],
 ["You boil a few clean-looking leaves in your cup and sip the weak tea. It is not much, but it warms you and settles your stomach.",
  "The leaves turn out to be bitter and thin. You pour the cup out, still hungry."],
 ["You dangle a line in the dark water and wait. A fat little fish bites, and you cook it quickly.",
  "The muddy water gives you nothing but weeds, and the splashing draws attention."]]);

V("D1-MSH-BH",
"As night falls, the marsh softens under your feet. Bubbles rise in the mud, and the dry patches shrink around you. The sinking ground makes every step feel like it might be your last on solid land.\n\nYou need to rest somewhere. You could cross the soft ground to dry land, stay on the hummock and hope it holds, build a reed raft, or leave the marsh if you know what is coming.",
"The marsh ground softens and sinks as night falls.",
[["You run lightly, jumping from tuft to tuft, and reach firm, dry ground on the other side. You settle in and sleep.",
  "Your foot breaks through the crust and you sink to your hip. A watcher tags you out of the Trials, and your band flashes red."],
 ["You stay on the hummock and spread your weight. It sinks a little, but it holds, and you sleep on a wet cushion.",
  "The hummock slowly sinks. You wake up damp and cold, with mud creeping up your legs."],
 ["You lash reeds into a floating platform and lie down on it. You drift quietly with the water, hidden by the fog. You keep the raft for tomorrow.",
  "The raft will not stay together. You tie what you can and sleep sitting up."],
 ["You remember what you learned and walk out of the marsh before the water rises. You find a dry spot to rest, far from the soft ground."]]);

/* --- narr_02_day2.js --- */
/* ============ NARRATIVE: Day 2 main events ============ */
/* Days 1 and 2: the A events can happen in the morning OR at midday, so they never name the time of day. B events are evenings. */

/* ----- Day 2 standard ----- */
V("D2-DEP-A",
"Most of the Depot has been picked clean since yesterday. Empty crates are scattered across the floor like fallen blocks. But in the shadows near the back wall, one crate is still sealed. On its lid there is a keypad with three glowing symbols: a sun, a wave and a leaf. Someone has already scratched at it with a knife and given up.\n\nThe symbols look important. They might be the code to something big, perhaps even the Beacon. You could try to crack the keypad, scavenge the scraps left behind, or hide in the rafters and see who comes through.",
"One sealed crate remains in the picked-over Depot, with a keypad showing a sun, a wave and a leaf.",
[["You study the pad and notice which symbols are worn from use. You try an order, and the lid clicks open. Inside there is a rare item, and a screen scrolls the whole Beacon code for you to memorize.",
  "You try a few orders, and the keypad buzzes angrily each time. The sound echoes through the dome."],
 ["You turn over empty crates and find a few crumbs and a half-eaten ration bar that someone dropped.",
  "You search every corner, but everything useful is long gone. You find only dust and wrappers."],
 ["You climb into the rafters and stay perfectly still. Below, a few contenders come and go, and you learn a couple of things about them.",
  "You settle in the rafters, but a beam creaks under you. Someone looks up, frowning."]]);

V("D2-DEP-B",
"The sun sinks low and the Depot glows red. Ines walks through the huge doors with two followers at her sides. Ines is the confident, ambitious contender from Timberline who has been racing ahead of everyone since the Trials began. Her recall band is glowing, and they are scanning the dome for easy targets.\n\nYou are in plain sight. You could try to make a deal, run for the exit, or strike first and tag Ines before she tags you. If you have an ally, you could stand together.",
"Ines and two followers enter the Depot at sunset, looking for easy targets.",
[["You step forward with open hands and speak calmly. Ines hesitates, then nods. She has a spare item and trades it to you to stay out of your way.",
  "You offer a truce, but Ines only laughs. You have to retreat, and word that you backed down spreads quickly."],
 ["You sprint for the exit, dodging crates. Ines's followers shout, but you are faster, and you vanish into the dark.",
  "You run, but a follower hooks your arm. You tear free and escape, but the whole dome heard the struggle.",
  "You trip over a crate and tumble right at Ines's feet. She taps your band, and it flashes red!"],
 ["You dart forward and tap her band before she can react. It flashes, and Ines is out of the Trials. Her followers freeze, and then back away in shock. The whole dome saw it.",
  "You lunge, but Ines slips aside. The cameras swing toward you both, and she backs off, grinning. 'Later,' she says. Now everyone knows where you are."],
 ["You stand with your ally, shoulder to shoulder. Ines looks at the two of you, judges the odds and decides to move on. It is noisy, though."]]);

V("D2-PIN-A",
"In the soft ground of Whisper Pines, giant paw prints cross the trail. They are three times larger than a human footprint, and the bark on a nearby tree is scraped open at shoulder height. The Overseers released Roamers overnight. Roamers are simulated predators that hunt contenders by sound and movement. They are not real, but being tagged by one still ends your run.\n\nThe tracks are fresh. You could follow them to learn where the Roamers are going, climb a tree and wait, or set a lure and snare to make them wander off.",
"Giant Roamer paw prints cross the trail in Whisper Pines. The Overseers released them overnight.",
[["You study the prints and read which way the Roamer is heading. You choose a path in the other direction, and stay quiet as you pass.",
  "You read the prints wrong. Just as you step off the trail, you see the Roamer's shape between the trunks, and it turns toward you."],
 ["You scramble up a tall pine and cling to a branch. From up here you can see Beacon Hill glowing above the trees to the north. The Roamer passes below without looking up.",
  "You climb, but a branch snaps under your boot. The crack rings out like a gunshot, and every head in the forest turns."],
 ["You tie a lure of noisy cans and a bit of food, and set a snare nearby. The Roamer wanders off toward the lure, and you catch a small meal. You also learn how Roamers lose interest when you are quiet.",
  "Your lure clatters too loudly and the snare tangles. You back away, hoping nothing noticed."]]);

V("D2-PIN-B",
"The night turns cold, and a thin mist hangs between the trees. A fire would warm you, but it would also light up the whole forest, and the Roamers are out there. Rivals are as likely to see the glow as friends are.\n\nYou are shivering. You could build a smokeless fire, burrow into a pile of leaves, or, if you have a partner, share body heat.",
"A cold night in Whisper Pines. A fire would warm you but light up the forest.",
[["You dig a small pit, line it with stones and burn only dry twigs. The fire gives off almost no smoke and a very low glow. You rest warm and safe, with a little extra spring in your step tomorrow.",
  "The fire flares up bright and smoky. You stamp it out quickly, but not before the glow spreads between the trees."],
 ["You scoop a pile of dry leaves into a deep nest and burrow into it. It is rustly but warm. You sleep soundly.",
  "The leaves are damp and cold. You shiver until the sun rises."],
 ["You and your ally curl up back to back under a pile of needles. Sharing warmth keeps you both cozy through the night."]]);

V("D2-LAK-A",
"The heat surge has begun. The Overseers have turned up the sun over the Basin, and the air over Clearwater Lake wobbles like jelly. The sand burns your feet, and your water drains faster out here in the open. You can feel the sweat dripping.\n\nThe lake is the best place in the Basin to be on a hot day, but you still need a plan. You could drink and rest in the shade, build a shade-net to wait out the heat, or swim across the lake to the far shore.",
"A heat surge shimmers over Clearwater Lake. Water drains faster in the sun.",
[["You find a patch of shade by a rock and drink slowly, breathing steady. The cool shade does you good, and you feel refreshed.",
  "The shade is thin and you cannot get comfortable. You drink what you can and keep sweating."],
 ["You stretch a cloth between two poles and tie it down. It blocks most of the sun and makes a cool pocket. The heat will not hurt you as much today.",
  "The poles keep falling and the cloth keeps slipping. After a long struggle, you have a sad, saggy shade."],
 ["You wade in and swim across with steady strokes. The water is cooling, and on the far side you climb out, skipping the trail altogether.",
  "A strong tug drags you off course. You crawl ashore on the wrong beach, and your pack is lighter than it was."]]);

V("D2-LAK-B",
"Dark clouds roll over the lake as evening falls. Thunder rattles the shore, and the first drops of rain splash the sand. The Overseers are putting on a storm, and it looks like a good one. Everything will be wet soon.\n\nThe rain could be a gift if you catch it, and a danger if you stay out in the open. You could shelter under an overturned boat hull on the shore, collect rainwater with your gear, or make a dash across the open shore to the Pines.",
"Dark clouds and thunder roll over Clearwater Lake in the evening. The Overseers have started a storm.",
[["You flip an old boat hull over your head and prop it up. The rain drums on top, but you stay dry, and the noise covers the sounds you make.",
  "The boat hull leaks, and the storm blows it sideways. You spend the night damp and annoyed."],
 ["You spread every container, cloth and cup you own across the beach. By the time the rain slows, you have collected plenty of fresh water.",
  "The rain comes sideways and half of your catch spills. You still collect a little."],
 ["You race across the open sand toward the Pines, ducking each rumble of thunder. You reach the trees soaked but safe.",
  "You run, but the shore is slick and you stumble. Rivals on the beach turn to look.",
  "You slip and slide straight into a rival waiting under a log. Your band flashes red!"]]);

V("D2-RID-A",
"The trail up Ridgeback is a steep zigzag of switchbacks, slick with morning dew. Each turn climbs higher, and each turn is narrower than the last. Above you, the Beacon tower glimmers faintly on the horizon. Climbing is the only way to get a better look at where it sits.\n\nYou could try to free-climb a shortcut straight up the cliff, use a rope if you have one, or follow a gentler goat trail around the side.",
"A steep, dew-slick switchback trail climbs Ridgeback toward a view of the Beacon.",
[["You pick a line of cracks and climb carefully, hand over hand. At the top, you can see the Beacon rising above the Pines and the Ridge, and you know where it sits. You also stay out of sight on the way up.",
  "Halfway up, a hold crumbles and you slide. In the scramble, something from your pack falls into a crack and is gone.",
  "The cliff face lets go and you drop. A safety net catches you, and your band flashes red!"],
 ["You tie your rope around a boulder and climb with confidence. At the top you can see the Beacon rising above the Pines and the Ridge."],
 ["You follow a faint goat trail that winds around the cliff. Halfway along, you find a thin trickle of water running over the rocks, and you drink.",
  "The goat trail fades into rubble, and you spend a lot of energy finding your way back."]]);

V("D2-RID-B",
"The wind howls across a narrow ledge on Ridgeback. It is a hard place to sleep, but it is high and hard to reach, and the stars are bright through gaps in the clouds. Below, the lights of the arena twinkle like a map.\n\nYou could anchor a tarp or cloak against the wind, huddle with an ally to keep warm, or stay awake to stargaze and study the lights.",
"A windy, narrow ledge on Ridgeback at night. Stars shine through gaps in the clouds.",
[["You tie your tarp to rocks on both sides and make a tight little tent. The wind slides over the top, and you sleep soundly.",
  "The tarp flaps and snaps in the wind. You hold it down with your arms and barely sleep."],
 ["You and your ally press together against the rock. Between the two of you, the wind hardly touches you, and you wake up warm and ready."],
 ["You lie on your back and trace the lights in the arena below. You notice that the Depot's lights flicker, and you work out that the dome is going to collapse on Day 3. You also notice what the Overseers have planned.",
  "The stars are lovely, but clouds drift over them. You lose track of what you were looking at."]]);

/* ----- Day 2 hard ----- */
V("D2-DEP-AH",
"The sealed crate with the keypad is still there, but now it sits at the bottom of a tilting tower of crates. The stack groans with every breath of air. The three symbols on the pad, the sun, the wave and the leaf, glow steadily underneath all of that weight.\n\nThe prize may be worth a lot, but one wrong touch could bring the whole tower down. You could try cracking the keypad, pull supplies from the sides, or climb to the rafters and watch.",
"The keypad crate sits at the bottom of a tilting tower of crates that groans at every touch.",
[["You slide under the leaning stack and work the keypad with trembling fingers. The lid clicks open, and out comes a Recovery Patch, along with the whole Beacon code on a small screen.",
  "The tower tilts and tips. Crates rain down on you, and your band flashes red!"],
 ["You pull a few crates from the sides without touching the base. Inside one, there is a ration.",
  "You tug at a crate, and the tower wobbles. You freeze, and then the whole room hears it settle."],
 ["You climb to the rafters and watch the crowd below. You pick out some interesting habits among the contenders.",
  "You climb up, but a rafter rattles under you. Someone looks up with a frown."]]);

V("D2-DEP-BH",
"The sun sets, and Ines leads a group of four rivals into the Depot. They fan out across the dome, checking every corner with their lights. This is not a casual patrol. They are hunting.\n\nYou are on their route. You could run for the exit, hide in a crate, or offer a truce. If you have an ally, you could stand together.",
"Ines leads four rivals into the dome at sunset. They are checking every corner.",
[["You break for the exit and weave between the stacks. The group shouts and chases, but you reach the doors first and vanish into the dark.",
  "Ines cuts across the room and gets in front of you. She taps your band, and it flashes red!"],
 ["You squeeze into an open crate and pull the lid down. Footsteps pass, and a light sweeps across the slats. You hold your breath and wait until they go.",
  "The lid creaks as you close it, and Ines walks straight to it. She grins down at you."],
 ["You step out with open hands and make an offer. Ines studies you for a long moment, and then nods. She will walk with you.",
  "Ines hears you out and shakes her head. 'No deal,' she says, and signals her group to close in."],
 ["You and your ally stand together. The group hesitates, then turns back. Still, everyone has seen where you stand."]]);

V("D2-PIN-AH",
"Three Roamers pad between the trees of Whisper Pines, noses to the ground. Each is as big as a pony, with long legs, a narrow head and glowing eyes. They are circling closer to the trail you are on. They hunt by sound and movement, so any noise could bring all three at once.\n\nYou could freeze and let them pass, climb a tree, or lead them away with a lure.",
"Three Roamers, noses to the ground, pad between the trees toward you.",
[["You go completely still, barely breathing. The Roamers sniff within a few steps of your boots, and then move on. You stay frozen until the forest is quiet again.",
  "A twig cracks under your toe. All three heads swing toward you, and one of them lunges. Your band flashes red!"],
 ["You scramble up a thick pine. Above the treetops, you can see Beacon Hill glowing to the north. The Roamers sniff at the trunk and wander off.",
  "The branches are thin, and you slip. The Roamers circle below while you cling on, and everybody within earshot hears the commotion."],
 ["You throw a rattling lure far into the woods, then crouch. The Roamers bolt after the noise. You learn that quiet makes them lose interest.",
  "Your lure falls short and clatters near your feet. The Roamers turn your way, and you scramble away, noisy."]]);

V("D2-PIN-BH",
"The night turns bitterly cold, and fog hangs thick between the trees. Your breath puffs out in white clouds. The cold feels very real. You can feel it in your bones, and it is the kind of cold that makes people careless.\n\nYou could bury yourself in pine boughs, build a smokeless fire, or, if you have an ally, share body heat.",
"A bitterly cold, foggy night in Whisper Pines.",
[["You pile pine boughs over yourself until only your nose is showing. The needles trap the heat, and you sleep warm.",
  "The cold seeps through the branches. Your teeth chatter, your limbs go numb, and your safety band triggers a shimmer that takes you away."],
 ["You dig a deep pit and burn only the driest twigs. The coals glow low and clean. Warm and cozy, you rest well.",
  "The fire sparks and flares. A bright glow spills up between the trees, and a lot of eyes are on it."],
 ["You and your ally wrap up together under a heap of needles. The shared heat keeps you both comfortable."]]);

V("D2-LAK-AH",
"The heat is fierce today. The lake has shrunk back from its shore, and the sand is baking. The water you can reach is warm and shallow. Cool, deep water lies farther out, but it is a long way to swim.\n\nYou could swim across to the far shore, dive for deep, cold water pockets, or build a shade-net and wait.",
"The heat is fierce and the lake has shrunk back from the shore.",
[["You take a deep breath and swim hard. The far shore is cool and quiet, and you scramble out, skipping the trail entirely.",
  "Halfway across, your arms give out. A lifeguard drone scoops you up, and your band flashes red!"],
 ["You dive into the deep and find a cold pocket of water under a rock. You fill up to the top and come back up, gasping.",
  "You dive, but the cold pocket is smaller than you hoped. You come up with less than you went down with."],
 ["You tie a cloth between two poles and settle under it. It is hot, but the shade is real, and the heat will not hurt you as much.",
  "The poles keep tipping over. It takes forever, and in the end you have only a bit of shade."]]);

V("D2-LAK-BH",
"Simulated lightning rakes the shore, and thunder rolls over the water. This is a much bigger storm than any rain you have seen. Every flash lights up the whole lake, and the wind pulls at you.\n\nYou could run for the Pines, shelter under an overturned boat hull, or collect rainwater while it falls.",
"Simulated lightning rakes the shore and thunder rolls over the lake.",
[["You leap forward and race through the storm, ducking at each flash. You make it to the trees, soaked and shaking.",
  "A bolt cracks right in front of you, and the safety system tags your band. It flashes red!"],
 ["You shove a boat hull over yourself and wait out the storm in its echoing dark. You are dry, if a little deaf.",
  "The hull rattles with each thunderclap. You hold it down for hours, and everyone around hears the noise."],
 ["You spread your containers and catch the rain as it falls. By the time the storm eases, you have more fresh water.",
  "The wind blows the rain sideways, and you catch only a little."]]);

V("D2-RID-AH",
"Rain has soaked the cliff and made the switchback trail into a muddy stream. Water pours down the rocks, and every hold is slick. The climb that was already steep is now very risky.\n\nYou could free-climb the slick face, climb with a rope, or take the gentler goat trail.",
"Rain has made the cliff slick and the switchback trail into a stream.",
[["You find hidden cracks and move in short, careful steps. At the top, you can see the Beacon rising above the Pines and the Ridge, and nobody saw you climb.",
  "Your hand slips and you fall. A safety net catches you, and your band flashes red."],
 ["You tie off your rope, test each knot and climb. At the top, you can see the Beacon rising above the Pines and the Ridge.",
  "The rope slips on a wet rock, and you drop part of your pack. Something falls away into the dark."],
 ["You pick your way along the goat trail. The rain has made a small pool in a hollow, and you drink.",
  "The goat trail is a mud slide. You make little progress and slip a lot."]]);

V("D2-RID-BH",
"A hard wind rakes the ledge, and loose stones skitter into the dark. The weather has worsened, and the ledge is smaller than you remember. It is a risky place to sleep, but the view is wide.\n\nYou could stay on the open ridge and watch the sky, anchor a tarp or cloak, or, with an ally, huddle together.",
"A hard wind rakes the ledge and loose stones skitter into the dark.",
[["You brace yourself against a boulder and watch the sky. The Overseers' lights give away a plan, and you see that the Depot will collapse. You learn what is coming.",
  "A gust catches you and throws you against the rocks. The safety system tags your band, and it flashes red."],
 ["You tie your cloak between two stones and crawl under it. The wind howls overhead, but you sleep sheltered.",
  "The cloak tears loose and flaps away. You huddle behind a rock all night."],
 ["You and your ally press back to back against the stone. Warm and steady, you wake ready for the day."]]);

/* --- narr_03_day3.js --- */
/* ============ NARRATIVE: Day 3 main events ============ */
/* Day 3: A events are in the MORNING, B events are at MIDDAY. Evening is the finale at Beacon Hill. */

/* ----- Day 3 standard ----- */
V("D3-PIN-A",
"You wake to a smell of smoke. Overnight, the Depot collapsed in a cloud of dust, and the Overseers have started a simulated wildfire in Whisper Pines. A wall of orange light and heat is sweeping through the trees, herding every contender toward the hills. This is the push toward the final day.\n\nThe fire is not real, but the heat and the roar are. You have to move. You could outrun it along the creek, dig a firebreak and shelter, or climb above the smoke.",
"A simulated wildfire sweeps through Whisper Pines from the collapsed Depot.",
[["You sprint down the creek bed with the fire crackling behind you. Water splashes at your boots, and you burst out of the trees with the heat on your back.",
  "You run, but the creek twists, and the smoke blinds you for a few steps. You get out, but you make a lot of noise.",
  "A burning branch crashes across the creek right in front of you. The safety system flashes your band red!"],
 ["You scrape a wide ring clear of needles and hunker down in the middle. The fire roars around you, and then moves on. You feel stronger for having outlasted it.",
  "The break is too narrow and the heat is too strong. You scramble out of the ring, leaving part of your gear behind."],
 ["You scale a tall rock and climb above the smoke. From up here you can see a high route toward the Beacon, and you mark it in your mind.",
  "You climb, but the smoke follows. You cough and make a lot of noise as you struggle down."]]);

V("D3-PIN-B",
"The fire has passed, and the forest is quiet at midday. Hanging from a branch, there is a drop from the Overseers. A card is tied to it: Take one. Food, water, or a route map. It swings gently in the smoky air.\n\nIt may be a gift or it may be a trick. You could take one item and go, cut the whole drop down for everything, or leave it for someone else and earn the audience's favour.",
"An Overseer drop hangs from a branch. A card says: Take one. Food, water, or a route map.",
[["You take what you need and leave the rest. The drop sways as you leave."],
 ["You climb up, saw through the cord and let the whole drop fall. You grab everything you can carry before anyone shows up.",
  "You cut the cord, but the drop lands hard and something breaks. You salvage what you can, and the crash echoes through the trees."],
 ["You glance up at the camera drones, shrug and walk past. A few of them swivel to follow you. The audience likes it."]]);

V("D3-LAK-A",
"The Overseers are draining Clearwater Lake. A deep rumble runs through the ground, and the water is pulling back from the shore, leaving ribbons of mud and gasping fish behind. This is the last easy water in the Basin, and everyone knows it.\n\nThe shore is crowded, and the lake gets shallower every minute. You could fill everything fast, wade out to a cache on the island, or fill up together with an ally.",
"The Overseers are draining the lake. This is your last easy water.",
[["You sprint along the shore and fill every container you own. The water is warm and muddy but good enough.",
  "You fill up in a rush, but the mud sucks at your boots and you spill. You get some, and you make a lot of noise."],
 ["You wade out over the draining mud to the island. In a hollow of rock, a hidden cache holds a rare item, and you fill up from a clear pool.",
  "The mud is deeper than it looks. You get stuck, tear your way free and leave something behind."],
 ["You and your ally fill your containers side by side. While you work, you talk, and you learn something about the other contenders."]]);

V("D3-LAK-B",
"At midday you find a wooden dock at the edge of the draining lake. Tied to it is a raft, built by the Overseers to carry contenders toward Beacon Hill. It looks sturdy at first, but the rope is frayed and the deck is cracked. A sign says: Take the fast way.\n\nA raft means a shortcut, but rafts break. You could repair it and launch, pole across the shallows, or skip it and walk the shore.",
"An Overseer raft sits at a dock, built to carry contenders to Beacon Hill.",
[["You re-tie the rope, patch the crack and push off. The raft glides downstream and carries you straight to Beacon Hill, fast and quiet.",
  "The raft is more broken than you thought. You limp it down the river, and the creaking is loud, but you arrive at Beacon Hill."],
 ["You jump aboard and push with a long pole. The raft slides across the shallows, and you reach Beacon Hill with the sun still high.",
  "The pole snaps in the mud. You spin, lose something over the side and arrive late."],
 ["You decide the raft is not worth the risk and walk the shore on foot. It is a long way, but you stay in control.",
  "The shore path is a tangle of mud and roots. You take your time, and you make some noise."]]);

V("D3-RID-A",
"From the ridge, you finally see it: the Beacon tower, glowing in the distance on top of Beacon Hill. It looks close, but the way there is a puzzle. Three paths lead toward it: the high ridge, the low valley and the cover of the rocks. Every other contender can see the tower too.\n\nThe path you choose will shape how you arrive. You could take the high ridge route, the valley route, or wait and watch from cover.",
"From the ridge, the Beacon tower glows in the distance. Three paths lead toward it.",
[["You pick the narrow ridge and pick your way along it. It is hard going, but the footing holds, and the route puts you above everyone else.",
  "The ridge path is steeper than it looked. You arrive winded, and you have lost your rest."],
 ["You slip into the valley, keeping to shadow and brush. The walk is quiet and long, and you find a safe approach.",
  "The valley is full of sticks and dry leaves. You crackle along and tell the world where you are."],
 ["You wait quietly behind a boulder and watch. A rival stumbles into the open, and an Overseer trap snaps shut around them. They are tagged out.",
  "You wait and watch for a long time, but nothing happens. The shadows grow long, and you learn nothing new."]]);

V("D3-RID-B",
"At midday, you reach a narrow pass on Ridgeback. Two NPCs stand in the middle of it, arguing loudly. They are blocking the path, and neither of them will move. If you go through, you will have to deal with them. If you go around, you will have to climb.\n\nThe pass is the quickest way toward the Beacon. You could broker a truce, sneak past, or rope down the cliff.",
"Two NPCs argue in a narrow pass on Ridgeback, blocking the path.",
[["You step between the two of them and calm things down. They shake hands, and one of them agrees to join you. Because you were quiet, nobody saw.",
  "You try to calm them down, but both of them start shouting at you. The whole ridge hears."],
 ["You press against the rock wall and slide past, a step at a time. They do not even look up.",
  "A pebble clatters from your boot. Both of them stop arguing and stare at you for a moment."],
 ["You tie off your rope and lower yourself down the cliff next to the pass. In moments you are on the far side, close to the Beacon.",
  "The rope is old, and it slips. You drop and lose something, but you land in the right place."]]);

/* ----- Day 3 hard ----- */
V("D3-PIN-AH",
"The simulated wildfire is faster and wider than anyone expected. Flames lick along the ground, and the heat bends the air. Trees crack and fall behind you. This is the Overseers' biggest show, and they want you to run.\n\nYou have only seconds. You could outrun it along the creek, dig a firebreak, or climb above the smoke.",
"The simulated wildfire is faster and wider than anyone expected. Flames lick along the ground.",
[["You hurtle down the creek bed, leaping logs and splashing through shallows. You burst out of the trees just ahead of the flames.",
  "A burning tree falls right in front of you. The safety system flashes your band red."],
 ["You scrape the ground clear and crouch inside the ring. The heat is huge, but the break holds. You come out of it hardened and ready for the finale.",
  "The fire jumps your break. You flee, and your gear burns behind you. Everyone sees the smoke."],
 ["You scale a rocky outcrop and cling to the top as the flames pass below. From up here you spot a high route to the Beacon.",
  "The rock is hot and your grip slips. You jump down in a hurry, and the whole forest hears."]]);

V("D3-PIN-BH",
"Three Overseer crates hang from the trees. A card on the middle one reads: One of these is real. The crates are identical, and the ropes are knotted in different ways. The others may be traps.\n\nYou could cut the crate loose from the high branch, study the knots and pick one, or leave them alone.",
"Three Overseer crates hang from the trees. A card reads: One of these is real.",
[["You climb to the high branch and saw the right rope. The crate drops, and you get a gift, and then another from inside it.",
  "You pick the wrong rope. The crate bursts open in a cloud of sticky foam, and the safety system flashes your band red."],
 ["You study the knots and notice the one that was tied last. That is the real one, and you take its gift.",
  "You guess, and you guess wrong. The crate is empty, and the trap rings a bell that carries across the forest."],
 ["You walk past the crates without touching them. The cameras swing toward you, and the audience applauds."]]);

V("D3-LAK-AH",
"The lake drains fast now, and a whirlpool churns at the centre. The Overseers have pulled a plug somewhere, and the water spirals toward the middle. The edges are shrinking and the island is rising out of the mud.\n\nYou could wade to the island cache, fill everything at the edge, or fill up together with an ally.",
"The lake drains fast and a whirlpool churns at the centre.",
[["You cross the mud flats in long strides, skirting the whirlpool. On the island, you find a cache with a rare item, and you fill up from a clear pool.",
  "The whirlpool's edge catches your foot and pulls. You are dragged under, and your band flashes red!"],
 ["You fill everything you have at the edge, filling and capping as fast as you can. Some water spills, but you get plenty.",
  "The mud grabs your pack and tears something away. You get a little water, and you lose some gear."],
 ["You and your ally fill your containers side by side. While you work, you talk, and you pick up a few clues."]]);

V("D3-LAK-BH",
"The Overseer raft is damaged. A beam is cracked, a rope has come loose, and the water under the dock moves fast. The lake is draining into a rushing river that leads toward Beacon Hill. A broken raft is still a fast way to travel, if you can handle it.\n\nYou could ride it down the rapids, repair it first, or walk the shore.",
"The Overseer raft is damaged, with a cracked beam and a loose rope.",
[["You hop aboard and grip the rope. The raft shoots down the rapids, bouncing off rocks, and you hold on. You arrive at Beacon Hill soaked and breathless, but first.",
  "The raft hits a rock and breaks in two. You are swept off, and your band flashes red!"],
 ["You work quickly, binding the beam and tightening the rope. The raft holds, and you float down to Beacon Hill with a fast route.",
  "The repair does not hold, and you have to patch it as you go. It takes extra time, and the noise draws attention."],
 ["You decide the river is too risky and walk the shore. It is slow going, but you stay dry and in control.",
  "The shore is a tangle of reeds and mud, and you struggle along it, making noise."]]);

V("D3-RID-AH",
"Rivals are watching every route toward the Beacon. Shapes move on the ridge, in the valley and among the rocks. It feels like the whole Basin is holding its breath. A wrong move now could cost you the entire run.\n\nYou could take the high ridge, take the valley route, or wait and watch.",
"Rivals are watching every route toward the Beacon.",
[["You climb the ridge with careful hands, moving only when the watchers look away. It is the hardest way, but you reach the top unseen.",
  "A watcher spots you on the skyline and signals. A rival rushes along the ridge and tags your band. It flashes red!"],
 ["You slide into the valley and creep along in the shadows, a step at a time. You find a good route.",
  "The valley is full of loose gravel. You crunch loudly, and the watchers swivel to look. A fight is coming."],
 ["You crouch behind a boulder and watch the rivals. One of them wanders into view, steps on a hidden trap and is tagged out.",
  "You crouch and watch, but the rivals stay hidden. You learn nothing, and your legs go stiff."]]);

V("D3-RID-BH",
"Rivals have set an ambush in the narrow pass. It is quiet. Too quiet. There are no birds, no wind and no argument this time. You can feel it in your neck: someone is waiting.\n\nThe pass is the quickest way toward the Beacon, but it could be a trap. You could sneak through, broker a truce with whoever is hiding, or rope down the cliff beside it.",
"Rivals have set an ambush in the narrow pass, and it is quiet. Too quiet.",
[["You press against the rock and slip through, one silent step at a time. You hear a breath, but nobody sees you, and you are through.",
  "A hand reaches out of the rocks and taps your band. It flashes red!"],
 ["You call out softly and offer a deal. After a long pause, a figure steps out and agrees to walk with you. You stay quiet, and the others do not spot you.",
  "You call out, and the ambushers burst out of hiding. A fight is on."],
 ["You tie off your rope and slip down the cliff. At the bottom you are past the pass, closer to the Beacon.",
  "The rope is too short and you drop the last stretch. You lose something in the landing."]]);

/* --- narr_04_inter1.js --- */
/* ============ NARRATIVE: Day 1 interstitials (surprise encounters) ============ */
/* l = full text (first time), s = short reminder, b = specific button label, pass/fail = result stories, x = critical failure story (when different) */
const J=(id,o)=>{NARR.inter[id]=o;};

J("I1-01",{
 l:"Glossy purple berries hang low over the trail, so ripe they look like jewels. Your stomach has been growling for hours, and the berries smell sweet. But you do not know which plants in the Basin are safe. If you check the leaves and the stems carefully, you might be able to tell whether these are good. A mistake could end your run.",
 s:"Glossy purple berries hang over the trail. You are hungry, but you must be sure they are safe.",
 b:"Pick the berries",
 pass:"You study the leaves and stem, then taste one tiny berry. It is sweet and safe, and you pick a pocketful.",
 fail:"You pop a berry in your mouth and your tongue goes numb. Your recall band begins to flash red. These were not safe!",
 skip:"Leave the berries alone"});

J("I1-02",{
 l:loc=>({
  forest:"A clear stream trickles between the roots of the pine trees, cold and bright over the stones. You are thirsty, and your container is nearly empty. Even clear water can hide things you cannot see, so you need to check the source, the colour and the smell before you drink. If you have a filter, it will clean the water for you.",
  water:"Along the shoreline, a little channel of water feeds into the lake. It looks cleaner than the main lake water, but it runs over mud. You are thirsty, and you should check the source, the colour and the smell before you drink. If you have a filter, it will clean the water for you.",
  rock:"A thin thread of water runs down the rock face and drips into a hollow. It looks clear, but it comes from who-knows-where above. You are thirsty, so you must check the colour and the smell before you drink. If you have a filter, it will clean the water for you.",
  marsh:"A shallow trickle winds between the reeds, tea-brown over black mud. You are thirsty, and your container is nearly empty. Marsh water can make you sick, so you must check it carefully before you drink. If you have a filter, it will clean the water for you."}[loc]||"A clear trickle of water runs over some stones. You are thirsty, and you must check the water carefully before you drink."),
 s:loc=>({forest:"A cold stream runs between the pine roots.",water:"A little channel of water feeds the lake.",rock:"A thin thread of water runs down the rock.",marsh:"A brown trickle winds through the reeds."}[loc]||"A trickle of water runs nearby.")+" Is it safe to drink?",
 b:loc=>({forest:"Fill up from the stream",water:"Fill up from the channel",rock:"Catch the water in a hollow",marsh:"Collect the marsh water"}[loc]||"Fill up from the trickle"),
 pass:loc=>({forest:"You scoop the cold water into your container and let it settle. It tastes sweet, like snow and pine needles.",water:"You fill your container from the channel and check it against the light. It looks clear, and it tastes fresh.",rock:"You catch drops in a hollow and fill your container slowly. It is cold and clean, and tastes like stone.",marsh:"You strain the brown water through cloth and let it settle. It is not tasty, but it is safe enough."}[loc]||"You fill up. The water tastes clean."),
 fail:loc=>({forest:"The stream looked clear, but it tastes oddly sour. Your stomach cramps, and you toss out some of your food.",water:"The water has a muddy, slimy taste. Your stomach turns and you lose some of your food.",rock:"The water tastes of metal, and your tummy flips. You lose a bit of your food.",marsh:"The marsh water is thick and foul. Your stomach flips and you lose some food."}[loc]||"The water makes you queasy and you lose some food."),
 skip:"Walk on without drinking"});

J("I1-03",{
 l:"Behind a screen of branches, you find an abandoned camp. A half-built shelter leans against a rock, and beside a cold fire ring sits a ration bar in a wrapper. Someone left in a hurry. The question is whether it is a real gift or the camp of someone who will be back soon. A careful search will tell you.",
 s:"An abandoned camp with a ration bar beside a cold fire ring.",
 b:"Search the camp for food",
 pass:"You look carefully before you touch anything, then pick up the ration bar. Nobody comes back, and the food is yours.",
 fail:"You rummage through the camp too quickly and knock over a pot. The clatter rings through the area.",
 skip:"Leave the camp alone"});

J("I1-04",{
 l:"A great tree rises above you, heavy with fat brown nuts. They are too high to reach from the ground, but the trunk is thick and the branches are low. Nuts are filling and keep well, and you would love to have a few in your pocket. With a good shake or a solid climb, you might bring some down.",
 s:"A nut tree, heavy with fat brown nuts.",
 b:"Shake the nut tree",
 pass:"You wrap your arms around the trunk and shake with all your strength. Nuts rain down, and you scoop up a handful.",
 fail:"You push and pull, but the trunk will not budge. Only a couple of nuts fall, and you cannot find them.",
 skip:"Move on"});

J("I1-05",{
 l:"In the dust and mud ahead, you spot two sets of footprints that go in different directions. One set is deep and wide. The other is lighter and quick. Someone passed here not long ago, perhaps two someones. If you read the prints carefully, you might learn something about who they are.",
 s:"Two sets of footprints lead in different directions.",
 b:"Study the footprints",
 pass:"You crouch and study the prints. The deeper ones belong to someone tired and the light ones to someone nervous. You learn something about them.",
 fail:"You study the prints, but you step in one and smudge it. In the end you learn nothing, and you leave your own prints behind.",
 skip:"Ignore the footprints"});

J("I1-06",{
 l:"A thick wall of vines hangs between the trees, woven as tight as a net. You could go around, but it would take a long time. Behind the vines you can hear a faint trickle. If you can hack through, you might find a short cut that lets you avoid the next problem down the trail.",
 s:"A thick wall of vines blocks the trail.",
 b:"Hack through the vines",
 pass:"You tear and twist and pull the vines apart. Behind them is a hidden path that skips past trouble ahead.",
 fail:"The vines are tough and sticky. You fight for ages and end up sweaty and thirsty, with nothing to show for it.",
 skip:"Go around"});

J("I1-07",{
 l:"Up ahead, a cheerful young contender sits on a log and waves at you with both arms. It is Kit, from Greenhollow, a farming Region. Kit is known for sharing snacks and avoiding fights. Kit calls out and says he would like to team up. Having an ally can help, but you have to speak up and make the first move.",
 s:"Kit, a cheerful contender from Greenhollow, waves from a log and offers to team up.",
 b:"Wave back and walk over",
 pass:"You walk over and shake Kit's hand. His grin gets even wider, and he opens his pack to share a snack.",
 fail:"You stumble over your words, and Kit looks confused. After an awkward moment, Kit waves goodbye and wanders off.",
 skip:"Nod politely and walk on"});

J("I1-08",{
 l:"A camera drone buzzes down from the sky and hovers in front of your face, its lens whirring. Drones belong to the Overseers, and they send pictures to an audience that is watching the Trials. If the audience likes you, they can give you Audience Favour, which helps you later. You could play to the camera, but it also draws attention.",
 s:"A camera drone hovers close. You could play to the camera.",
 b:"Play to the camera",
 pass:"You give the drone a confident smile and a daring wave. The audience loves it, but so does everyone nearby.",
 fail:"You try a trick, but you trip over your own feet. The drone zooms in, and people nearby notice.",
 skip:"Ignore the drone"});

J("I1-09",{
 l:"On the side of a boulder, someone has scratched a pattern of lines and dots, as if it were a signal. It might be a message left by a contender, or a clue left by the Overseers. If you can decode it, you might find a hidden cache of supplies, but the code is not simple.",
 s:"Scratched marks on a boulder look like a signal.",
 b:"Decode the scratched marks",
 pass:"You trace the marks and the pattern clicks. Behind a loose stone, you find a hidden cache with a useful item.",
 fail:"You stare and stare, but the marks make no sense. After a while, you give up.",
 skip:"Walk away"});

J("I1-10",{
 l:"Small pebbles skitter down the slope above you, bouncing off the rocks with a clatter. A moment later, a bigger stone follows, and then another. The slope is starting to slide. If you move fast, you might dodge, but if you wait, the rocks will come down on you.",
 s:"Pebbles skitter down the slope above you. A rock slide is starting.",
 b:"Dash out of the way",
 pass:"You sprint sideways just as a shower of stones crashes where you were standing. You are covered in dust, but fine.",
 fail:"You leap clear, but a rock clips your pack as it bounces past. The clatter brings attention.",
 x:"A boulder rolls straight into your path. You cannot jump in time, and your band flashes red!"});

J("I1-11",{
 l:"A thin, shiny line glints across the trail, almost invisible between two bushes. It is a trip wire. Someone has rigged this path to catch passing contenders. If you step on it, a trap will spring, and if you are careful, you might disarm it and take the trap for yourself.",
 s:"A thin trip wire glints across the trail.",
 b:"Disarm the trip wire",
 pass:"You hold your breath and ease the wire loose. The trap folds up in your hands, and you tuck it away for later.",
 fail:"The wire snaps and the trap bangs shut with a loud clank. Heads turn all around you.",
 x:"You touch the wire and the whole trap fires. A net drops from above, and your band flashes red!"});

J("I1-12",{
 l:"Silver shapes dart in a shallow pool right in front of you. They are small fish, quick and bright, and there are lots of them. Fish are a great meal, but catching them takes patience and clever hands. You have nothing but your bare hands and a sharp stick.",
 s:"Silver fish dart in a shallow pool.",
 b:"Spear a fish",
 pass:"You stand motionless over the pool, then strike. The stick comes up with a fat silver fish, and you cook it quickly.",
 fail:"You thrash and splash, but the fish slip away. The noise echoes across the water.",
 skip:"Let them swim"});

J("I1-13",{
 l:"A deep horn sounds across the Basin, long and low. It is a signal from the Overseers or a call from another contender, and you cannot tell which. If you listen carefully, you might work out where it came from and move away from trouble.",
 s:"A horn sounds across the Basin.",
 b:"Listen for where the horn came from",
 pass:"You hold still and listen, and you trace the sound to the north. You choose your steps and stay out of trouble.",
 fail:"The horn echoes around you and you cannot pin it down. You wander about for a while and make noise.",
 skip:"Ignore the horn"});

J("I1-14",{
 l:"High in a hollow of the tree, a humming hive hangs like a swollen bag. Honey is sweet and filling, and the bees are angry. If you light a small, smoky fire under it and move slowly, you might calm the bees long enough to scoop some out.",
 s:"A humming bee hive hangs in a hollow tree.",
 b:"Smoke out the bees and take the honey",
 pass:"You light a smoky twig and wave it under the hive. The bees go sleepy, and you scoop out a handful of sticky honey.",
 fail:"The smoke goes the wrong way and the bees swarm out. You run, waving your arms, and everybody hears.",
 skip:"Back away slowly"});
