/* --- narr_06_world.js --- */
/* ============ NARRATIVE: fights, travel, places and action turns ============ */

/* ----- Conflicts (tag fights) ----- */
const CF=(id,l,s)=>{NARR.conf[id]={l,s};};
CF("C1-01","At a fork in the trail, Ines steps out from behind a tree with a smirk on her face. Ines is from Timberline, a logging Region, and she is the most confident contender in the Basin. She has been racing ahead of everyone, and she loves a challenge. Her recall band glows, ready to tag.\n\nYou can see her weight shift onto her toes. She has not said a word, but she does not need to. She wants a fight.","Ines steps out at a fork in the trail, smirking, her band glowing and ready.");
CF("C1-02","At the water's edge, Kit stands guard over a shallow pool full of fish. Kit is the cheerful contender from Greenhollow, a farming Region, and he does not like to fight. But he is protecting his dinner, and his eyes dart nervously to your pack.\n\nHe has not raised his hands. He looks like he would rather share than fight, but he will not back down if you push.","Kit guards a fish pool and eyes your pack nervously.");
CF("C1-03","A broad figure blocks the trail ahead. It is Bram, from Stonefield, a quarry Region of rock and iron. He is big and quiet. He folds his arms and says nothing. He does not seem angry, only certain. It is clear he is not going to move for you.\n\nBram is much stronger than you, but he tires on long chases. You may not want to fight him head on.","Bram blocks the trail with his arms folded. He is not angry, only certain.");
CF("C2-01","High on a ledge above you, Wren waits, calm and balanced. Wren is from Highmeadow, a grassland Region, and a watchful scout who rarely speaks. From up there, Wren can see every move you make. The ledge is hard to reach, and a fight on it would be risky.\n\nThe high ground is a big advantage for Wren. If you have a rope, or you know the way around, your odds are better.","Wren waits on the high ledge above you, calm and balanced.");
CF("C2-02","You and Dax reach the same supply drop at the same moment. Dax is from Gearworks, a Region of machines and repair shops, and he talks fast and always has an angle. His fingers close on one side of the crate and yours close on the other. His eyes sparkle, and his other hand drifts toward a gadget on his belt.\n\nHe is clever, but his gadgets can be jammed. A quick hand and a smart trick could change the odds.","You and Dax reach the same supply drop at the same moment.");
CF("C2-03","Orla crosses the ford and stops, blocking the stepping stones. Orla is a calm navigator and trader from Harbor Reach, a fishing Region. She is strong and sure-footed on wet ground, but she would rather trade than fight. She waits with a patient smile.\n\nIf you want to cross, you will have to deal with her one way or another.","Orla blocks the stepping stones at the ford, calm and patient.");
CF("C2-04","Two rivals burst from the reeds, bands flashing. They had been listening for you, and your noise gave you away. They move together like partners, one to each side.\n\nTwo against one is a hard fight. You could stand and fight, but talking or running might be wiser.","Two rivals burst from the reeds, bands flashing.");
CF("C3-01","Ines is back, faster and fiercer than before. She has been tagging contenders all day, and the Overseers' drones are following her closely. She steps in front of you with a grin of pure confidence.\n\nIn a fight, Ines rushes in too fast and overreaches. That may be your chance, if you can use it.","Ines is back, faster and fiercer this time.");
CF("C3-02","Two rivals hold the narrow pass together, shoulder to shoulder. They have been waiting for someone to come through, and they are in no mood to talk. Behind them, the way toward the Beacon opens up. The only way ahead is through them.\n\nIt is a gauntlet. You may need to be bold, or you may need to be very clever.","Two rivals hold the narrow pass together.");

/* Outcome lines for each opponent: win, lose, talkOk, talkFail, fleeOk, fleeFail, nbr (greeting a neighbour) */
NARR.cfo.Ines={win:"You dodge her wild swing and tap her band. It flashes, and Ines vanishes in a shimmer with a surprised look on her face.",lose:"Ines is quicker than you thought. She taps your band, and it flashes red. 'Better luck next time,' she calls as you fade.",talkOk:"You tell Ines that tagging each other only helps the others. She thinks it over, shrugs and steps aside.",talkFail:"Ines laughs at your words. 'Talk is for losers,' she says, and lunges.",fleeOk:"You turn and sprint. Ines gives chase for a few steps, then loses you in the trees.",fleeFail:"You run, but Ines is fast. She catches up and grabs at your sleeve.",nbr:"Ines sees that you come from a nearby Region and tips her head in a nod. 'Go on,' she says."};
NARR.cfo.Kit={win:"You tap Kit's band gently. It flashes, and Kit blinks, then shrugs and vanishes with a little wave.",lose:"Kit panics and swings his pack. It bumps your band, and it flashes red. 'Sorry!' he calls as you fade.",talkOk:"You speak kindly and Kit's shoulders drop. 'I did not want to fight anyway,' he says, and steps aside.",talkFail:"Kit's eyes widen. 'You want my fish!' he squeaks, and he charges.",fleeOk:"You back away and dash into the trees. Kit does not follow.",fleeFail:"You run, but Kit chases, still holding his pack.",nbr:"Kit grins. 'You are from near Greenhollow, right? Neighbours do not fight!' He waves you past."};
NARR.cfo.Bram={win:"You use his slowness against him. Bram swings and misses, and you tap his band. It flashes, and the big contender gives you a solemn nod before he vanishes.",lose:"Bram is simply too strong. He catches your wrist and taps your band. It flashes red.",talkOk:"You talk calmly about the Basin and the rules. Bram listens, then steps aside without a word.",talkFail:"Bram shakes his head slowly. He has made up his mind.",fleeOk:"You run, and Bram plods after you. He tires quickly and gives up.",fleeFail:"You run, but Bram strides surprisingly fast. He catches you at the creek.",nbr:"Bram nods slowly. 'Stonefield, Gearworks,' he rumbles. 'We look out for each other.' He steps aside."};
NARR.cfo.Wren={win:"You catch Wren off guard on the ledge. Your tag lands, and Wren's band flashes. Wren gives you a rare half smile and fades away.",lose:"Wren is perfectly balanced. A quick, quiet tap, and your band flashes red.",talkOk:"Wren studies you silently, then nods. A single word: 'Go.'",talkFail:"Wren says nothing. Slowly and calmly, Wren steps forward.",fleeOk:"You scramble down the rocks and are gone before Wren can follow.",fleeFail:"You run, but Wren sees every step and cuts you off.",nbr:"Wren recognises the way you stand and gives you a small nod. 'Neighbour,' Wren says."};
NARR.cfo.Dax={win:"You jam the gadget, grab his arm and tap his band. It flashes, and Dax groans. 'Oh, come on!' he says as he vanishes.",lose:"Dax flicks a switch. His gadget pings against your band, and it flashes red. 'Works every time!'",talkOk:"You and Dax haggle quickly. 'Fine, take it,' he says with a grin, and lets go.",talkFail:"Dax laughs. 'Nice try,' he says, and pulls out his gadget.",fleeOk:"You let go of the crate and run. Dax is too busy gathering it to chase you.",fleeFail:"Dax throws a small device. It tangles your feet.",nbr:"Dax spreads his hands. 'Fellow machine folk? Take the crate, my friend!'"};
NARR.cfo.Orla={win:"You catch Orla on the slippery stones. She tips into the shallows, and her band flashes. 'Well played,' she says, and vanishes.",lose:"Orla is steady and sure. A tap, and your band flashes red.",talkOk:"You offer a fair deal, and Orla steps aside with a smile.",talkFail:"Orla shrugs. 'I thought we were done talking,' she says.",fleeOk:"You hop away across the stones. Orla does not follow.",fleeFail:"You run, but the wet stones are Orla's home turf. She catches up fast.",nbr:"Orla smiles. 'A harbour friend or a farm friend,' she says. 'Go on across.'"};
NARR.cfo.rivals={win:"You duck, spin and tap each of them in turn. Their bands flash, and they vanish, one after the other.",lose:"They surround you. A tap from behind and your band flashes red.",talkOk:"You speak so calmly that the rivals lower their hands and wander off.",talkFail:"The rivals exchange a look and then rush you.",fleeOk:"You sprint through the brush and lose them in the trees.",fleeFail:"You run, but they split up and cut you off.",nbr:"The rivals recognise you and let you pass."};

/* ----- Places: full intro (first visit), short reminder, and one ambience line per day for action turns ----- */
const LC=(k,l,s,amb)=>{NARR.loc[k]={l,s,amb};};
LC("DEP","The Depot is the great glass dome at the centre of the Basin. Supply crates rise in tall stacks, and the Overseers' camera drones glide overhead. It is the busiest and loudest place in the Trials, and the easiest place to be noticed.","The Depot dome: crates, noise and many watchers.",["Contenders shuffle between the crate stacks, and drones circle overhead.","Most of the crates are empty now, and every footstep echoes.","The dome groans and creaks, close to collapsing."]);
LC("PIN","Whisper Pines is a dark, quiet forest of tall pine trees. The ground is soft with needles, the roots are tangled, and every sound travels. It is a good place to hide, to find wood and to set snares.","Whisper Pines: tall trees, soft needles and quiet.",["Wind sighs through the pine branches, and needles muffle your steps.","Dry needles crackle underfoot, and the heat makes the air smell like resin.","Smoke hangs in the trees, and the air tastes of ash."]);
LC("LAK","Clearwater Lake is a wide, shining lake with a sandy shore. It is the best source of water in the Basin, but the open ground gives you no cover. Many contenders come here to drink.","Clearwater Lake: sand, sparkle and open ground.",["Small waves lap at the sand, and a few footprints cross the shore.","The heat surge shimmers over the beach, and the water glitters.","The lake is draining, leaving wide rings of mud around the edge."]);
LC("RID","Ridgeback is a long, rocky ridge rising above the Basin. It is hard to climb, but it has caves, ledges and wonderful views. From up here, you can see almost everything, and others can see you.","Ridgeback: rock, wind and long views.",["Wind whistles over the bare rock, and the Basin spreads out below.","Heat rises from the rocks like steam, and the stones are warm to the touch.","Ash drifts down from the burning forest, and the Beacon glows to the north."]);
LC("MSH","Mistmarsh is a flat, wet place of black mud, tall reeds and low fog. Strange pale lights drift over the water. It is a good place to hide and find food, but the Overseers say it floods at night.","Mistmarsh: mud, reeds, fog and pale lights.",["Fog curls around the reeds, and the mud sucks at your boots.","(Mistmarsh is flooded and closed today.)","(Mistmarsh is flooded and closed today.)"]);
LC("BEA","Beacon Hill rises at the north of the Basin, crowned by the great Beacon tower. A stone stair climbs the hill, and a panel with three glowing symbols waits at the top. Whoever lights the Beacon wins the Trials.","Beacon Hill: the tower, the stone stair and the panel.",["The Beacon is not open yet.","The Beacon is not open yet.","The tower hums, and the stone stair waits below it."]);

/* ----- Travel: one passage for each direction of each link, plus a line for the day's conditions ----- */
const TR=(k,l,s)=>{NARR.trav[k]={l,s};};
TR("DEP>PIN","You leave the dome through its western gate and follow a gravel ramp down to the edge of the Basin. The glass walls fall behind you. The trail narrows, and the first tall pines rise ahead, dark against the sky.","You leave the dome by the west gate and follow the ramp into the trees.");
TR("PIN>DEP","The pines thin out as you walk east, and the ground turns hard and flat. Then the great glass dome rises ahead, glittering. The trail ends at a wide ramp that leads into the Depot.","The pines thin and the glass dome rises ahead.");
TR("DEP>LAK","You exit by the south side of the dome and follow a long, dusty path down a gentle slope. The air grows damp and cool, and you hear the lapping of water before you see the lake.","You take the long south path down to the lake.");
TR("LAK>DEP","You climb the slope away from the shore, with sand giving way to grass and gravel. The glass dome shines ahead of you, catching the light, and you walk up to its gates.","You climb the slope from the lake to the dome.");
TR("DEP>RID","East of the dome, the ground starts to rise. The path switches back through dry grass and scattered boulders, until the rocky spine of Ridgeback looms above you.","You follow the path east into the rising rocks.");
TR("RID>DEP","You pick your way down the rocky slope. The boulders get smaller and the grass grows thicker, until the glass dome appears below you.","You climb down from the ridge toward the dome.");
TR("PIN>LAK","From the Pines, you follow a creek south and east. The trees thin, the creek widens and the light brightens. Soon you step out of the shade onto soft sand, and the lake stretches before you.","You follow the creek out of the trees to the lake shore.");
TR("LAK>PIN","You leave the sandy shore and follow a creek northwest. The air grows cooler, and the first pines rise ahead. Under the branches, the sound of the lake fades.","You follow the creek from the lake back into the pines.");
TR("PIN>RID","You cross the northern part of the Basin on a long trail, up through scrub and over rocky ground. The pines drop away behind you. Ahead, the ridge climbs toward the sky.","You hike the long northern trail from the pines to the ridge.");
TR("RID>PIN","You leave the ridge and follow a trail northwest through scrubby bushes. The rocks give way to soil and then to needles, and the tall pines close in around you.","You hike the long trail from the ridge to the pines.");
TR("PIN>MSH","From the Pines, you head south. The ground gets wetter and softer with every step. Mist rises from the earth, the smell of mud thickens, and you enter a world of reeds.","You head south from the pines into the wet reeds.");
TR("MSH>PIN","You wade out of the mud and onto drier ground. The reeds thin, the ground firms, and the sweet smell of pine drifts to you through the fog.","You wade out of the marsh and into the pines.");
TR("LAK>MSH","You follow the southern shore of the lake toward the west. The sand gives way to soggy grass and then black mud. The lake fades into fog, and tall reeds close around you.","You follow the shore west until the sand turns to mud.");
TR("MSH>LAK","You leave the mud behind and follow the marsh edge toward the lake. The fog thins, the reeds shrink and sand appears under your feet, bright and warm.","You leave the mud for the sandy lake shore.");
TR("PIN>BEA","A narrow, steep trail climbs out of the pines toward Beacon Hill. The trees fall away, and the Beacon tower glows above you, much bigger than it looked from far away. A stone stair waits at the base of the hill.","You climb the steep trail from the pines to Beacon Hill.");
TR("BEA>PIN","You descend from the hill by the narrow trail, with the Beacon at your back. The first pines appear below, dark and cool.","You go down the trail from the hill into the pines.");
TR("RID>BEA","You follow a ridge path northwest, along a ledge with a long view. The Beacon tower glows closer and closer, until a stone stair rises ahead.","You follow the ridge path to the foot of Beacon Hill.");
TR("BEA>RID","You leave the hill by the ridge path and head southeast, with the tower shrinking behind you. The ground turns rocky and the ridge rises ahead.","You follow the ridge path away from the hill.");
NARR.misc.hurry="You hurry across the Basin toward {to}.";
/* conditions along the way: [Day 1, Day 2, Day 3] for each destination */
NARR.travday.DEP=[null,"The dome glints in the heat as you arrive.",null];
NARR.travday.PIN=[null,"The heat has dried the needles, and they crunch loudly under your boots.","Smoke is drifting between the trunks, and the air stings your eyes."];
NARR.travday.LAK=[null,"The heat surge shimmers over the sand, and the water looks very inviting.","The shoreline has pulled back, leaving rings of mud as the lake drains."];
NARR.travday.RID=[null,"The rocks are hot, and heat ripples off them in waves.","Ash drifts down from the burning forest, and the ridge is hazy."];
NARR.travday.MSH=[null,null,null];
NARR.travday.BEA=[null,null,"The Beacon hums above you as the light fades."];

/* ----- Action turns: a specific label and two short stories for each action at each place ----- */
const AC=(k,loc,b,p,f,x)=>{(NARR.act[k]=NARR.act[k]||{})[loc]={b,p,f,x};};
/* Find water */
AC("water","PIN","Find water: follow the sound of a stream","You follow a quiet gurgle until you find a stream running between the roots. The water is cold and clear, and you fill your container.","You follow the sound, but the stream turns out to be a dry gully. Your boots crunch loudly on the way back.");
AC("water","LAK","Find water: fill up at the lakeshore","You crouch at the water's edge and fill your container with sparkling lake water. It is cold and a little sandy, but good.","You rush the job, spill half of it and splash loudly. A few heads turn across the water.");
AC("water","RID","Find water: catch the drips from the rock","You find a crack in the rock where water drips slowly into a hollow. Drop by drop, you fill your container.","The drips are so slow that you give up. The scraping of your container on the rock carries far.");
AC("water","MSH","Find water: strain the water from the marsh pools","You dip your container into a pool and strain the brown water through cloth. It is not tasty, but it is safe enough.","The pool is thick and foul. You slosh around trying again and again, and the noise carries over the reeds.");
/* Forage */
AC("forage","DEP","Forage: search the crates for scraps","You dig in the corners of the empty crates and find a few ration crumbs and a dried fruit bar.","You search crate after crate, but everything useful is long gone.");
AC("forage","PIN","Forage: gather pine nuts and wild onions","You scoop pine nuts from fallen cones and pull a few wild onions from the soil. It makes a decent snack.","You search under the trees for an hour, but all you find are needles and bitter bark.");
AC("forage","LAK","Forage: fish in the shallows","You stand still in the shallows and snatch a small fish with your hands. You roast it over a tiny flame.","The fish dart between your fingers. You come out wet and hungry.");
AC("forage","RID","Forage: search the ledges for hardy plants","You find a patch of sour berries and some chewy leaves clinging to a ledge. They are not tasty, but they are food.","You search the ledges, but there is nothing but bare rock and lichen.");
AC("forage","MSH","Forage: pick marsh plants and berries","You pull up cattail roots and pick a handful of berries you know are safe. It is a muddy meal, but filling.","You chew on a few bitter leaves and spit them out. You are still hungry.","You pop an unknown berry in your mouth, and your stomach lurches. Your band begins to flash red!");
/* Scout */
AC("scout","DEP","Scout: watch the crowd from the top of a crate stack","You climb a crate stack and watch the crowd below. You spot details that most people miss.","You climb up, but a crate shifts under you. Heads turn toward the noise.");
AC("scout","PIN","Scout: climb a tall pine for a look around","You climb high in a pine and look out over the Basin. You see more than you expected.","The branches are thin and sticky with sap. You climb back down having seen little, and sap on your hands.");
AC("scout","LAK","Scout: study the shoreline from the dunes","You lie flat on a dune and scan the beach and the water. You notice some interesting things.","There is little cover, and a glint of your gear gives you away.");
AC("scout","RID","Scout: climb to a high point","You climb to a rocky perch with a huge view. From up here, you can see almost everything.","The wind makes your eyes water and the dust blurs your view. You see little, and you are easy to spot.");
AC("scout","MSH","Scout: wade to a hummock to look through the fog","You wade to a hummock and peer through the fog, patient and still. Slowly the shapes become clear.","The fog is too thick to see anything. You splash back, noisy and muddy.");
AC("scout","BEA","Scout: study the tower from the foot of the hill","You study the Beacon tower and the stone stair. You notice how everything fits together.","You squint at the tower, but the glare is too bright. Your moving around draws a glance.");
/* Hide */
AC("hide","DEP","Hide: slip between the crate stacks and stay still","You wedge yourself between two stacks and pull a tarp over you. The rivals pass by without looking.","Your foot pokes out from the tarp. A passing contender sees it and points.");
AC("hide","PIN","Hide: bury yourself in needles under a thick pine","You scrape together a pile of needles and burrow into it. You vanish into the forest floor.","The needles keep sliding off you. You rustle and shuffle, and the sound carries.");
AC("hide","LAK","Hide: lie low among the reeds","You wade into the reeds at the water's edge and settle down low. Nobody notices you.","The reeds are too thin to hide you. Ripples spread across the water from where you sit.");
AC("hide","RID","Hide: tuck yourself into a crevice","You slip into a deep crevice and pull your cloak around you. You are just another shadow in the rock.","The crevice is too narrow. You scrape and wriggle, and pebbles clatter down the slope.");
AC("hide","MSH","Hide: sink into the reeds and mist","You crouch in the reeds as the mist rolls over you. You are completely hidden.","You wade into the mud, but your boots squelch loudly. Ripples spread around you.");
AC("hide","BEA","Hide: crouch behind the stone stair","You tuck yourself behind the base of the stone stair. Nobody can see you from the path.","You crouch behind the stair, but your shadow stretches out across the stones.");
/* Recover */
AC("rest","DEP","Recover: rest in a quiet corner of the dome","You find a hidden corner and close your eyes. The noise of the dome fades, and you rest well.","The dome is too loud and busy for real rest. You doze, but wake feeling no better.");
AC("rest","PIN","Recover: nap against a tree trunk","You lean against a warm trunk and listen to the wind in the branches. You rest well.","The ground is lumpy and cold. You shift and twist, and never get comfortable.");
AC("rest","LAK","Recover: rest beside the water","You lie beside the water and listen to the waves. A calm settles over you, and you wake refreshed.","The sun is too bright and the sand is hot. You lie there, restless.");
AC("rest","RID","Recover: rest in a sheltered nook","You curl up in a nook out of the wind. The rock holds the warmth, and you rest.","The wind finds you even here. You shiver and sleep poorly.");
AC("rest","MSH","Recover: rest on a dry hummock","You find a dry hummock and sit with your back to a tuft of grass. Slowly, you relax and rest.","The ground is damp and cold. You nod off, but you wake feeling clammy.");
AC("rest","BEA","Recover: rest in the shadow of the tower","You rest in the shadow of the tower, surprisingly peaceful. You feel better.","The hum of the tower keeps you on edge. You cannot relax.");
/* Gather materials */
AC("gather","DEP","Gather materials: collect scrap wire, tape and bolts","You collect bits of wire, tape and bolts from the broken crates. They will be handy for building something later.","You pull at a crate and it makes a loud bang. You come away with only a few useless bolts.");
AC("gather","PIN","Gather materials: collect sticks, bark and pine pitch","You gather straight sticks, strips of bark and a ball of sticky pitch. They are the makings of a good camp.","You hunt around for good sticks, but they are all rotten or too short. You make a lot of noise.");
AC("gather","LAK","Gather materials: collect driftwood and reeds","You drag driftwood and reeds up the beach. They will be good for a shelter.","The driftwood is waterlogged and heavy. You haul it up, clumsy and splashing.");
AC("gather","RID","Gather materials: pry loose flat stones and cord scraps","You pry flat stones from the ledge and find a few scraps of old cord. They will help make a camp.","The stones will not budge. You grunt and strain, and the sound echoes.");
AC("gather","MSH","Gather materials: cut tough reeds and vines","You cut a bundle of tough reeds and vines. They are springy and strong.","The reeds are slippery and tear in your hands. You splash a lot and gather little.");
AC("gather","BEA","Gather materials: pull loose metal and cord from the tower base","You find loose metal strips and cord at the base of the tower. They are better than they look.","The metal clangs against the stone as you tug it free. The sound rings out across the hill.");

/* ============ NARRATIVE: the start, days, nights, finale, and end screens ============ */

NARR.misc.start={
 l:"Control's voice booms over the Basin: 'Contenders, take your places.' You stand on a ring of metal plates around the Depot, a great glass dome packed with supplies. Twenty-three other contenders stand on the ring with you, from six different Regions. Each of you wears a recall band on your wrist. If you are tagged by another contender, or you run out of Water or Fuel, the band flashes and carries you safely to the Recovery Hall. Nobody is hurt. The Overseers are watching from above.\n\nThe countdown starts at sixty seconds. Supplies glitter in the dome. Behind you, the dark trees of Whisper Pines wait quietly, and to the south the Lake glimmers. How will you begin?",
 s:"Control counts down from 60. Supplies glitter in the Depot dome, the trees wait to the west and the lake glimmers to the south. How do you begin?"};

NARR.start={
 1:{c:"You burst off the ring like a rocket and reach the pile before anyone else. The best crates are yours to choose from.",p:"You race across the plates and reach the pile among the first. Elbows fly, but you grab your share.",f:"You sprint, but the crowd is thick. Someone shoves you aside, and you are left with whatever you can catch.",x:"You trip over another contender's foot right at the start. A tag lands on your band before you can get up."},
 2:{c:"You scoop up a pack as the countdown ends and sprint for the trees. It is full of treats.",p:"You grab a pack from the ring and run. It is heavier than you expected, and full of supplies.",f:"You snatch a pack and run, but it is half empty. There is not much inside.",x:"You grab the first pack you see. It turns out to be a decoy, and an alarm inside blares as you run."},
 3:{c:"You race south and reach the lake before anyone else. You drink your fill and find a net washed up on the sand.",p:"You sprint south and reach the shore first. You fill your container to the brim.",f:"You run south, but two rivals beat you there. You drink anyway, nervously.",x:"You trip on a root halfway and spill your water. You reach the lake with less than you started with."},
 4:{p:"Quietly, you slip away from the ring and vanish into Whisper Pines. No one sees you go."},
 5:{c:"You stand perfectly still while the others rush away. You study every face and every step, and you notice a lot.",p:"You hold your ground and watch the crowd. You learn things that most people miss.",f:"You hesitate while everyone rushes away. By the time you move, you are behind.",x:"You stand frozen, watching, but you see nothing useful. The crowd thins out and you are left behind."}
};

NARR.misc.day={
 1:{l:"The Trials have begun. The Basin stretches around you: a glass dome, a dark forest, a shining lake, a rocky ridge, a misty marsh and, far to the north, a tower with a glowing light. Control says that the first day will be calm, and the Overseers will be watching.",s:"Day 1 of the Trials begins."},
 2:{l:"Dawn on Day 2 brings a gust of hot air. The Overseers have turned up the sun, and a heat surge shimmers across the Basin. Water will go fast today, and the lake is the best place to be. Overnight, the marsh flooded and is now closed, and giant paw prints are said to be crossing the forest. Control murmurs through your band: Roamers will be loose by midday.",s:"Day 2: a heat surge shimmers over the Basin. Mistmarsh is flooded, and Roamers will be loose by midday."},
 3:{l:"Day 3 starts with a deep rumble and a cloud of dust. The Depot has collapsed, and a wildfire is sweeping through Whisper Pines. The lake is draining, and the Overseers are herding everyone toward Beacon Hill. This is the last day of the Trials. By tonight, someone will light the Beacon.",s:"Day 3: the Depot has collapsed, the pines are burning, and the lake is draining. Tonight, someone will light the Beacon."}
};
NARR.misc.night={
 1:{l:"Night falls over the Basin. The stars come out, and cool air slides over the ground. Somewhere far away, a horn sounds. You close your eyes for a few hours, but you stay alert.",s:"Night 1: stars, cool air and a far-off horn."},
 2:{l:"Night falls again, and the heat of the day fades into a chill. The stars are bright, and the wind brings the smell of smoke from the Depot. Tomorrow will be the last day.",s:"Night 2: the heat fades, and the air smells faintly of smoke."}
};
NARR.misc.flood={l:"In the dark, you hear a low rumble. Water is pouring across Mistmarsh, rising fast through the reeds. It is the flood the Overseers planned. In moments, your camp is awash."};
NARR.misc.chime={
 c1:"A voice rolls over the Basin. Control is reading out the Beacon code, one symbol at a time. The first symbol is spoken in a whisper, and the sound is faint. Can you catch it?",

NARR.misc.collapse={l:"At dawn, the dome groans and starts to fall. Glass cracks and crates tumble. You have to get out before the whole roof comes down."};
NARR.misc.flee={l:"The Roamer lunges, eyes glowing and jaws wide. There is no time to think. You have to run!",pass:"You vault a log, spin around a trunk and dash into the dark. The Roamer loses your trail.",fail:"The Roamer is faster than you. It closes the gap, and your band flashes red."};

/* ============ state ============ */
let S=null,P=null,story=null,act=null,teacherOn=false,storageOK=true;
const KEY="trialsBetaV1";
const DBG=[];
function dbg(m){DBG.push(m);if(DBG.length>400)DBG.shift();if(teacherOn)renderTeacher();}
function loadP(){try{const t=localStorage.getItem(KEY);if(t)P=JSON.parse(t);}catch(e){storageOK=false;}if(P&&!P.seen)P.seen={};}
function saveP(){try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){storageOK=false;}}
const hasItem=id=>!!S&&(S.items.includes(id)||(id==="tinker"&&S.freeTinker));
const maxW=()=>hasItem("canteen")?4:3;
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* ============ UI helpers ============ */
function noteHtml(){if(!S||!S.notes.length)return"";const h=S.notes.map(n=>`<div class="notes">${esc(n)}</div>`).join("");S.notes=[];return h;}
function scene(title,html,keepNotes){
  story.innerHTML="";
  story.append(el("h2","",esc(title)));
  const n=(S&&!keepNotes)?noteHtml():"";
  story.append(el("div","txt",n+(html||"")));
  act=el("div","act");story.append(act);
  story.scrollTop=0;
  renderAll();
}
function setAct(...nodes){act.innerHTML="";nodes.forEach(n=>n&&act.append(n));}
function addAct(...nodes){nodes.forEach(n=>n&&act.append(n));}
function modal(title,nodes,onClose){
  const m=$("#modal"),b=$("#mbox");b.innerHTML="";b.append(el("h3","",esc(title)));
  (Array.isArray(nodes)?nodes:[nodes]).forEach(n=>b.append(typeof n==="string"?el("div","",n):n));
  const close=btn("Close",()=>{m.classList.remove("on");if(onClose)onClose();},"grey");close.style.marginTop="10px";b.append(close);
  m.classList.add("on");
}

function bonuses(st,k){
  const out=[[SN[st],S.stats[st]]];
  if(k){const sk=KS[k]||k;if(S.skills.includes(sk))out.push(["Skill: "+cap(sk),3]);}
  const have=S.items.concat(S.freeTinker?["tinker"]:[]);
  have.forEach(id=>{const it=ITEMS[id];if(k&&it.b.includes(k)){let n=it.bonus||2;if(id==="hatchet"&&S.reg==="Timberline")n=3;out.push([it.n,n]);}});
  S.allies.forEach(a=>{const sp=NPC[a].spec;if(sp&&(sp===k||sp===st))out.push([a+" (ally)",2]);});
  if(S.reg==="Harbor Reach"&&S.loc==="LAK")out.push(["Tide Reader",2]);
  if(S.reg==="Highmeadow"&&st==="sp"&&S.spDay!==S.day)out.push(["Long Strider",2]);
  if(S.rested)out.push(["Rested",2]);
  if(S.bonus)out.push(["Bonus",S.bonus]);
  if(S.fog&&st==="pe")out.push(["Fog",-2]);
  return out;
}
const sumB=b=>b.reduce((a,x)=>a+x[1],0);
function doCheck(spec,cb){
  const b=bonuses(spec.st,spec.k);(spec.extra||[]).forEach(x=>b.push(x));
  let dc=spec.dc,note="";
  if(S.useMat&&spec.cp&&S.mat>0){dc-=3;S.mat--;S.useMat=false;note=" (Materials made this check 3 easier)";}
  const forced=S.forceRoll;S.forceRoll=null;
  const roll=forced||d20();
  const bonus=sumB(b),tot=roll+bonus;
  const res=roll===20?"crit":roll===1?"fumble":tot>=dc?"pass":"fail";
  S.rested=false;S.bonus=0;
  if(S.reg==="Highmeadow"&&spec.st==="sp")S.spDay=S.day;
  dbg(`CHECK ${spec.label||""} ${spec.st}/${spec.k||"-"} need${dc} spin${roll}+${bonus}=${tot} -> ${res}`);
  showDice(spec,b,roll,tot,dc,res,note,cb);
}

function ac(){if(FAST()||!sndOn)return null;try{if(!AUDIOCTX){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AUDIOCTX=new C();}if(AUDIOCTX.state==="suspended")AUDIOCTX.resume();return AUDIOCTX;}catch(e){return null;}}
function tone(f,t0,dur,type,vol,f2){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),T=a.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+dur);g.gain.setValueAtTime(0.0001,T);g.gain.exponentialRampToValueAtTime(vol,T+0.008);g.gain.exponentialRampToValueAtTime(0.0001,T+dur);o.connect(g);g.connect(a.destination);o.start(T);o.stop(T+dur+0.05);}catch(e){}}
function tick(){tone(1150+Math.random()*120,0,0.035,"square",0.04);}
function bell(f,t0,len,v){tone(f,t0,len,"sine",v);tone(f*2,t0,len*0.7,"sine",v*0.45);tone(f*3,t0,len*0.4,"sine",v*0.2);}
function sfx(res){
  if(!ac())return;
  if(res==="pass")bell(880,0,0.9,0.16);
  else if(res==="crit"){[784,988,1175,1568].forEach((f,i)=>bell(f,i*0.11,i===3?1.2:0.5,0.14));}
  else if(res==="fail")tone(190,0,0.3,"triangle",0.28,80);
  else if(res==="fumble"){tone(230,0,0.28,"triangle",0.28,90);tone(150,0.22,0.55,"sawtooth",0.14,50);}
}
function tickLoop(rot,done){
  if(!ac())return;
  let prev=null,cum=0,idx=0,lastT=0;
  const f=()=>{
    if(done())return;
    const m=/matrix\(([^)]+)\)/.exec(getComputedStyle(rot).transform||"");
    if(m){const p=m[1].split(",").map(Number),ang=Math.atan2(p[1],p[0])*180/Math.PI;
      if(prev!==null){let d=ang-prev;if(d<-180)d+=360;if(d>180)d-=360;cum+=d;}
      prev=ang;const n=Math.floor(cum/18);
      if(n>idx){idx=n;const now=performance.now();if(now-lastT>26){lastT=now;tick();}}}
    requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
}
function wheelHTML(order){
  let s='<svg viewBox="0 0 230 230" role="img" aria-label="Spinner wheel with the numbers 1 to 20"><g class="rot" style="transform-origin:115px 115px">';
  const cx=115,cy=115,R=108;
  for(let i=0;i<20;i++){
    const a0=i*18*Math.PI/180,a1=(i+1)*18*Math.PI/180;
    const x0=cx+R*Math.sin(a0),y0=cy-R*Math.cos(a0),x1=cx+R*Math.sin(a1),y1=cy-R*Math.cos(a1);
    const n=order[i];
    const fill=n===20?"#e0b800":n===1?"#8f1414":(i%2?"#14736b":"#1d9a8f");
    s+=`<path d="M${cx} ${cy}L${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" fill="${fill}" stroke="#fff" stroke-width="1.5"/>`;
    const m=i*18+9,mr=m*Math.PI/180,tx=cx+86*Math.sin(mr),ty=cy-86*Math.cos(mr);
    s+=`<text x="${tx.toFixed(1)}" y="${(ty+5).toFixed(1)}" text-anchor="middle" font-size="15" font-weight="bold" fill="${n===20?"#222":"#fff"}" transform="rotate(${m} ${tx.toFixed(1)} ${ty.toFixed(1)})">${n}</text>`;
  }
  return s+'</g><circle cx="115" cy="115" r="14" fill="#1c2b33" stroke="#fff" stroke-width="2"/><polygon points="103,2 127,2 115,26" fill="#e8624f" stroke="#7a2a1f" stroke-width="2"/></svg>';
}
/* A 20-slice wheel. The numbers are shuffled into a new order every spin. The result is chosen first, then the wheel is aimed so the pointer stops on it. */
function makeWheel(roll){
  const order=shuffle(Array.from({length:20},(_,i)=>i+1));
  const wrap=el("div","wheel");wrap.innerHTML=wheelHTML(order);
  const rot=wrap.querySelector(".rot");
  const k=order.indexOf(roll),m=k*18+9,j=Math.random()*10-5;
  const target=360*(4+Math.floor(Math.random()*2))+(360-m)+j;
  let ended=false;
  const land=()=>{rot.style.transition="none";rot.style.transform=`rotate(${target}deg)`;};
  return{el:wrap,spin(cb){
    const end=()=>{if(ended)return;ended=true;wrap.onclick=null;wrap.style.cursor="";cb();};
    if(FAST()){land();end();return;}
    void rot.getBoundingClientRect();
    rot.style.transition="transform 4.8s cubic-bezier(.12,.55,.08,1)";
    rot.style.transform=`rotate(${target}deg)`;
    rot.addEventListener("transitionend",end);tickLoop(rot,()=>ended);
    setTimeout(end,5200);
    wrap.style.cursor="pointer";wrap.title="Click the wheel to skip the spin";
    wrap.onclick=()=>{land();end();};
  }};
}
function resultExplain(roll,bonus,tot,dc,res){

  const lab={crit:"CRITICAL SUCCESS!",pass:"Success",fail:"Not enough",fumble:"CRITICAL FAILURE!"}[res];
  return `<div>The wheel stopped on <b>${roll}</b>.</div><div>${roll} ${bonus>=0?"+":"-"} ${Math.abs(bonus)} (your bonuses) = <b>${tot}</b></div><div>You needed <b>${dc}</b>: ${tot>=dc?"enough":"not enough"}.</div>${nat}<div class="res ${res}">${lab}</div>`;
}

function inTerr(t){return t.includes("any")||t.includes(TERR[S.loc]);}
function maybeInter(){

  let ch=(S.day===1?.4:.5)+Math.max(0,S.noticed-2)*.1;ch=Math.min(.9,ch);
  const forced=S.noticed>=5;const roll=rnd();

  S.cont=nextTurn;

  if(S.roamers&&S.day===2&&!S.roamDone&&(S.loc==="PIN"||S.loc==="RID")){S.roamDone=true;return showInter(INTER[2].find(x=>x.id==="I2-02"));}

      S.usedInter.push(c.id);return startConflict(c);

  if(!pool.length)return nextTurn();
  if(S.noticed>=3){const amb=pool.filter(x=>x.amb);if(amb.length&&rnd()<.5)pool=amb;}

/* ============ turn flow ============ */
function pickEventId(){
  const d=S.day,t=S.turn,loc=S.loc;
  const slot=d===3?(t===1?"A":t===3?"B":null):(t===5?"B":"A");
  if(!slot||!EV[`D${d}-${loc}-${slot}`])return null;
  const pHard=Math.min(.95,[0,1/3,.5,2/3][d]+Math.max(0,S.noticed-2)*.1);
  const roll=rnd();let hard=roll<pHard;
  if(d<3&&slot==="A"){const key=d+loc;const used=S.dayUsed[key]||[];if(used.includes("A"))hard=true;else if(used.includes("AH"))hard=false;S.dayUsed[key]=used.concat(hard?"AH":"A");}
  dbg(`EVENT pick D${d}-${loc}-${slot} hard chance ${pHard.toFixed(2)} roll ${roll.toFixed(2)} -> ${hard?"HARD":"standard"}`);
  return `D${d}-${loc}-${slot}${hard?"H":""}`;
}

function night(){

  if(S.allies.length){S.noticed=clamp(S.noticed+S.allies.length,0,5);lines.push("Camping in a group makes you easier to spot.");}
  if(n===2&&S.allies.length&&S.fuel>1){S.fuel-=1;lines.push("You share food with your allies. Fuel -1.");}
  [...S.allies].forEach(a=>{if(S.loy[a]==="Fickle"&&(S.fuel<=1||S.water<=1)){S.allies=S.allies.filter(x=>x!==a);lines.push(a+" slips away in the night.");}});
  S.water=Math.max(0,S.water);S.fuel=Math.max(0,S.fuel);
  dbg(`NIGHT ${n}: water ${S.water} fuel ${S.fuel} noticed ${S.noticed}`);
  if(S.water<=0||S.fuel<=0){recallScreen(S.water<=0?"Your Water ran out in the night.":"Your Fuel ran out in the night.","exhausted");return;}
  if(S.allies.length){const a=pick(S.allies);lines.push("By the fire: "+clueFor(a));}
  const left=Math.max(2,24-n*7-(4-S.rivals)*2+ri(2));

let startBase="";
function startLog(extra){logM(`${startBase||"Start."} ${extra||""}`.replace(/\s+/g," ").trim());}
function startRun(){
  closeModal();newRun();
  const ns=NARR.misc.start||{};
  scene("The Start",fos("start",ns.l,ns.s)||paras("Control counts down from 60. You stand on a ring around the Depot with 23 other contenders. Supplies glitter in the dome. How do you begin?"));
  const sp=sg(sumB(bonuses("sp",""))),pe=sg(sumB(bonuses("pe","")));
  const opts=[
   btn(`${STARTLBL[1]} <span class="tag">Speed, need 11 (you add ${sp})</span> <span class="tag danger">Risky</span>`,()=>startRoll(1)),
   btn(`${STARTLBL[2]} <span class="tag">Speed, need 8 (you add ${sp})</span>`,()=>startRoll(2)),
   btn(`${STARTLBL[3]} <span class="tag">Speed, need 11 (you add ${sp})</span>`,()=>startRoll(3)),
   btn(`${STARTLBL[4]} <span class="tag">No roll</span>`,()=>startRoll(4)),
   btn(`${STARTLBL[5]} <span class="tag">Perception, need 11 (you add ${pe})</span>`,()=>startRoll(5))
  ];
  setAct(...opts);
}
function startRoll(n){
  const T=NARR.start[n]||{};
  const tx=res=>(res==="crit"?(T.c||T.p):res==="pass"?T.p:res==="fumble"?(T.x||T.f):T.f)||"";
  const done=(head,html,res)=>{const t=tx(res);startLog(head);showOutcome(head,(t?`<p>${esc(t)}</p>`:"")+html,false);};
  const toDay=()=>{S.cont=()=>startDay(1);};
  if(n===4){startBase=`Start: Chose "${STARTLBL[4]}". No roll.`;S.loc="PIN";addIns("pinsnares");S.noticed=0;done("You slip into the trees.","You arrive in Whisper Pines empty-handed but unseen.<br>New Insight: "+esc(insText("pinsnares")),"pass");toDay();return;}
  const cfg={1:["sp",11,"Sprint"],2:["sp",8,"Grab and run"],3:["sp",11,"Run for the Lake"],5:["pe",11,"Watch"]}[n];
  doCheck({st:cfg[0],k:"",dc:cfg[1],label:cfg[2]},r=>{
    const res=r.res;toDay();
    startBase=`Start: Chose "${STARTLBL[n]}". ${rollDesc(r)} ${RESW[res]}`;
    if(n===1){
      if(res==="fumble"){S.cause="Tagged in the opening scramble";S.cat="crit";startLog("You were tagged.");recallScreen("Tagged in the opening scramble","crit");return;}
      S.loc="DEP";
      if(res==="fail"){const id=itemRand();S.items.push(id);S.noticed=1;done("Shoved out by the crowd.",`You grab one scrap: ${esc(ITEMS[id].n)}.`,res);return;}
      S.noticed=2;const count=res==="crit"?3:2;if(res==="crit")S.fav++;
      showStockPick(count,tx(res));return;}
    if(n===2){
      const id=itemRand();S.items.push(id);
      if(res==="fumble"){S.noticed=2;S.loc=pick(["PIN","LAK","RID"]);done("The pack was a decoy!",`You still scoop ${esc(ITEMS[id].n)}, but it drew attention. You run to ${esc(LOC[S.loc].n)}.`,res);return;}
      if(res==="fail"){S.noticed=1;S.loc=pick(["PIN","LAK","RID"]);done("A half-empty pack.",`You find ${esc(ITEMS[id].n)}. You run to ${esc(LOC[S.loc].n)}.`,res);return;}
      S.fuel=3;if(res==="crit"){const id2=itemRand();S.items.push(id2);}
      S.q.push(()=>chooseMove(["PIN","LAK","RID"]));
      done("A good pack!",`You find ${esc(ITEMS[id].n)} and a ration.${res==="crit"?" There is even more inside!":""} Choose where to run.`,res);return;}
    if(n===3){
      S.loc="LAK";S.water=maxW();
      if(res==="fumble"){S.water=Math.max(1,S.water-1);done("You trip and spill your water.","You reach the Lake, but Water is down by 1.",res);return;}
      if(res==="fail"){S.noticed=1;done("You arrive behind two rivals.","You still drink, but they saw you coming.",res);return;}
      if(res==="crit"&&!S.items.includes("net"))S.items.push("net");
      done("You reach the Lake first.","Water filled. "+(res==="crit"?"You even find a Snag Net on the shore.":""),res); return;}
    if(n===5){
      const names=Object.keys(NPC).filter(x=>x!=="Ines");
      if(res==="fumble"){done("Nothing happens.","You watch, but see nothing useful.",res);S.q.push(()=>chooseMove(["DEP","PIN","LAK","RID"]));return;}
      if(res==="fail"){S.noticed=1;done("You froze and start late.","You are slow to react.",res);S.q.push(()=>chooseMove(["DEP","PIN","LAK","RID"]));return;}
      S.bonus+=2;let t="";shuffle(names).slice(0,2).forEach(x=>{t+="<br>"+esc(clueFor(x));});
      t+=`<br>The Depot still holds: ${S.stock.map(g=>esc(ITEMS[g].n)).join(", ")}.`;
      if(res==="crit")t+="<br>"+esc(nextEventText());
      done("You read the crowd.",t+"<br>+2 on your first roll. Choose where to go.",res);S.q.push(()=>chooseMove(["DEP","PIN","LAK","RID"]));return;}
  });
}
function showStockPick(count,narr){
  S.q=[];let chosen=[];
  scene("The Depot pile",(narr?`<p>${esc(narr)}</p>`:"")+`<p>You reach the supply pile. Pick up to <b>${count}</b> item${count===1?"":"s"}. Your pack holds 3.</p>`);
  const draw=()=>{
    const bs=S.stock.filter(g=>!chosen.includes(g)).map(g=>btn(`${esc(ITEMS[g].n)} <span class="tag">${esc(ITEMS[g].d)}</span>`,()=>{if(chosen.length<count&&S.items.length+chosen.length<3){chosen.push(g);if(chosen.length>=count||S.items.length+chosen.length>=3)fin();else draw();}}));
    bs.push(btn(`Done picking (${chosen.length}/${count})`,()=>fin(),"grey"));setAct(...bs);
  };
  const fin=()=>{chosen.forEach(g=>S.items.push(g));startLog("Took: "+(chosen.map(g=>ITEMS[g].n).join(", ")||"nothing")+".");showOutcome("You get away with supplies.",chosen.length?"You take: "+chosen.map(g=>esc(ITEMS[g].n)).join(", ")+".":"You leave empty-handed.",false);};
  draw();
}
/* ============ modals ============ */
function showLog(){
  const lines=S?S.log:[];let all=false;
  const hidden=lines.filter(e=>e.k==="w").length;
  const hdr=`Run ${P?P.runs+(S&&S.over?0:1):1} | ${P?P.name:""} of ${P?P.reg:""}\n`;
  const ta=el("textarea");ta.rows=14;
  const render=()=>{ta.value=hdr+lines.filter(e=>all||e.k==="m").map(e=>e.t).join("\n");};
  const tg=btn("",()=>{all=!all;lab();render();},"small grey");
  const lab=()=>{tg.textContent=(all?"Hide":"Show")+` all water and food choices (${hidden})`;};
  lab();render();
  const row=el("div","row");row.style.marginTop="6px";
  row.append(tg,btn("Copy",()=>{ta.select();try{document.execCommand("copy");}catch(e){}},"small"));
  modal("Run log (major decisions)",[el("p","small mut","Only the big decisions are listed: events, the Start, fights and the finale. Use the button to add your water and food actions."),ta,row]);
}
function showNotes(){
  let h="";
  if(!S){h="Start a run to take field notes.";}
  else{
    h+="<h4>Contenders</h4>";
    Object.keys(NPC).forEach(n=>{h+=`<div class="card"><b>${esc(n)}</b> (${esc(NPC[n].r)}): ${esc(NPC[n].look)}${S.gone.includes(n)?" <i>(tagged out)</i>":""}${S.allies.includes(n)?" <i>(your ally)</i>":""}<br>`+((S.clues[n]||[]).map(c=>"&bull; "+esc(c.replace("{n}",n))).join("<br>")||'<span class="mut">No clues yet.</span>')+"</div>";});
    h+="<h4>Beacon code</h4><div class='card'>"+[0,1,2].map(i=>`Symbol ${i+1}: ${S.codeKnown.includes(i)?SYM[S.code[i]]:"?"}`).join("<br>")+"</div>";
  }
  h+="<h4>Insights</h4><div class='card'>"+((S?[...S.ins]:(P?P.ins:[])).map(k=>"&bull; "+esc(insText(k))).join("<br>")||"None yet.")+"</div>";
  modal("Field Notes",el("div","",h));
}
function showMenu(){
  const c=el("div","");
  const code=P?btoa(unescape(encodeURIComponent(JSON.stringify(P)))):"";
  const ta=el("textarea");ta.rows=4;ta.value=code;
  const load=el("textarea");load.rows=3;load.placeholder="Paste a save code here";
  c.append(el("p","small","<b>Save code:</b> copy this somewhere safe. It restores your character on any computer."),ta);
  c.append(btn("Load this code",()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob(load.value.trim()))));if(o&&o.reg&&o.base){P=o;saveP();closeModal();title();}}catch(e){load.value="That code did not work.";}},"small"));
  c.insertBefore(load,c.lastChild);
  const r=el("div","row");r.style.marginTop="8px";
  r.append(btn("Large text",()=>document.body.classList.toggle("large"),"small grey"),btn("High contrast",()=>document.body.classList.toggle("contrast"),"small grey"),(()=>{const sb=btn(sndOn?"Sound: On":"Sound: Off",()=>{sndOn=!sndOn;try{localStorage.setItem("trialsSnd",sndOn?"1":"0");}catch(e){}sb.textContent=sndOn?"Sound: On":"Sound: Off";if(sndOn){bell(880,0,0.6,0.12);}},"small grey");return sb;})());
  c.append(r);
  c.append(el("hr"),el("p","small","<b>Start over with a new character</b> (this erases your Region, stats and Insights):"));
  c.append(btn("Reset game",()=>{if(confirm("Erase this character and start over?")){try{localStorage.removeItem(KEY);}catch(e){}P=null;S=null;closeModal();createChar();}},"coral small"));
  modal("Menu",c);
}
function readAloud(){try{const c=story.cloneNode(true);c.querySelectorAll('.wheel,svg').forEach(e=>e.remove());const t=c.textContent.replace(/\s+/g,' ');speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t));}catch(e){}}
/* ============ teacher build ============ */
function teacherLogin(){
  const inp=el("input");inp.type="password";inp.placeholder="Password";
  const msg=el("div","small","");
  modal("Teacher Build",[inp,msg,btn("Unlock",()=>{if(inp.value==="12345"){teacherOn=true;closeModal();$("#teacher").style.display="block";renderTeacher();}else msg.textContent="Incorrect password.";})]);
}
function renderTeacher(){
  const t=$("#teacher");if(!teacherOn){t.style.display="none";return;}
  t.style.display="block";
  let h=`<b>TEACHER BUILD</b> <button id="tClose">Close</button><button id="tLock">Lock</button>`;
  if(!S){h+="<p>No run in progress.</p>";t.innerHTML=h;bindT();return;}
  h+=`<h4>State</h4><table>
  <tr><td>Seed</td><td>${S.seed}</td></tr><tr><td>Day / Turn / Loc</td><td>${S.day} / ${S.turn} / ${S.loc}</td></tr>
  <tr><td>Water / Fuel</td><td>${S.water} / ${S.fuel}</td></tr><tr><td>Noticed</td><td>${S.noticed}</td></tr>
  <tr><td>Stats</td><td>${SK.map(k=>k+":"+S.stats[k]).join(" ")}</td></tr><tr><td>Region/skills</td><td>${S.reg} ${S.skills.join(",")}</td></tr>
  <tr><td>Items</td><td>${S.items.join(", ")||"-"}${S.freeTinker?" (+free tinker)":""}</td></tr>
  <tr><td>Materials / Favour</td><td>${S.mat} / ${S.fav}</td></tr><tr><td>Rested / bonus</td><td>${S.rested} / ${S.bonus}</td></tr>
  <tr><td>Allies</td><td>${S.allies.join(", ")||"-"}</td></tr><tr><td>Rivals left</td><td>${S.rivals}</td></tr>
  <tr><td>Gone</td><td>${S.gone.join(", ")||"-"}</td></tr><tr><td>Flags</td><td>${JSON.stringify(S.flags)} fin+${S.fin}</td></tr>
  <tr><td>Beacon code</td><td>${S.code.join(", ")} (known idx ${S.codeKnown.join(",")||"-"})</td></tr>
  <tr><td>Loyalties</td><td>${Object.keys(S.loy).map(n=>n+": "+S.loy[n]).join("<br>")}</td></tr>
  <tr><td>Depot stock</td><td>${S.stock.join(", ")}</td></tr><tr><td>Insights</td><td>${[...S.ins].join(", ")||"-"}</td></tr>
  <tr><td>Seen texts</td><td>${P&&P.seen?Object.keys(P.seen).length:0}</td></tr><tr><td>Used interstitials</td><td>${S.usedInter.join(", ")||"-"}</td></tr><tr><td>Wildcard</td><td>${S.wild?S.wild.type:"-"}</td></tr></table>`;
  h+=`<h4>Controls</h4>
  Jump: day <input id="tDay" type="number" min="1" max="3" value="${S.day}" style="width:40px"> turn <input id="tTurn" type="number" min="1" max="5" value="${Math.max(1,S.turn)}" style="width:40px">
  <select id="tLoc">${Object.keys(LOC).map(k=>`<option ${k===S.loc?"selected":""}>${k}</option>`).join("")}</select><button id="tJump">Go</button><br>
  Set: Water <input id="tW" type="number" value="${S.water}" style="width:40px"> Fuel <input id="tF" type="number" value="${S.fuel}" style="width:40px"> Noticed <input id="tN" type="number" value="${S.noticed}" style="width:40px"><button id="tSet">Apply</button><br>
  Next roll <input id="tRoll" type="number" min="1" max="20" style="width:50px"><button id="tRollGo">Force</button> ${S.forceRoll?"(forced "+S.forceRoll+")":""}<br>
  Add item <select id="tItem">${Object.keys(ITEMS).map(k=>`<option>${k}</option>`).join("")}</select><button id="tAdd">Add</button>
  <button id="tAlly">Add ally</button><button id="tFin">Go to finale</button><button id="tKnow">Know code</button><button id="tTut">Show tutorial</button><button id="tSeen">Reset seen text</button><br>
  Force event <select id="tEv">${Object.keys(EV).map(k=>`<option>${k}</option>`).join("")}</select><button id="tEvGo">Play</button><br>
  Force interstitial <select id="tIn">${[1,2,3].map(d=>INTER[d].map(x=>`<option>${x.id}</option>`).join("")).join("")}</select><button id="tInGo">Play</button>
  Conflict <select id="tCf">${CONF.map(c=>`<option>${c.id}</option>`).join("")}</select><button id="tCfGo">Play</button>`;
  h+=`<h4>Decision log (engine)</h4><div class="dbg">${DBG.slice(-120).reverse().map(esc).join("<br>")}</div>`;
  t.innerHTML=h;bindT();
}
function bindT(){
  const g=id=>$("#"+id);const on=(id,f)=>{const e=g(id);if(e)e.onclick=f;};
  on("tClose",()=>{$("#teacher").style.display="none";teacherOn=false;});
  on("tLock",()=>{teacherOn=false;$("#teacher").style.display="none";});
  if(!S)return;
  on("tJump",()=>{S.day=+g("tDay").value;S.loc=g("tLoc").value;S.heat=S.day===2;S.q=[];S.over=false;S.cont=null;beginTurn(+g("tTurn").value);});
  on("tSet",()=>{S.water=+g("tW").value;S.fuel=+g("tF").value;S.noticed=clamp(+g("tN").value,0,5);renderAll();});
  on("tRollGo",()=>{const v=+g("tRoll").value;S.forceRoll=(v>=1&&v<=20)?v:null;renderTeacher();});
  on("tAdd",()=>{const id=g("tItem").value;if(S.items.length<3)S.items.push(id);renderAll();});
  on("tAlly",()=>{const c=Object.keys(NPC).filter(n=>n!=="Ines"&&!S.allies.includes(n)&&!S.gone.includes(n));if(c.length&&S.allies.length<2)S.allies.push(c[0]);renderAll();});
  on("tKnow",()=>{S.codeKnown=[0,1,2];renderAll();});
  on("tTut",()=>openTutorial(false));
  on("tSeen",()=>{P.seen={};saveP();renderTeacher();});
  on("tFin",()=>{S.day=3;S.turn=5;S.q=[];S.over=false;S.cont=null;finale();});
  on("tEvGo",()=>{S.q=[];S.cont=afterTurn;showEvent(g("tEv").value,null);});
  on("tInGo",()=>{const id=g("tIn").value;const def=[1,2,3].map(d=>INTER[d]).flat().find(x=>x.id===id);S.q=[];S.cont=nextTurn;showInter(def);});
  on("tCfGo",()=>{const c=Object.assign({},CONF.find(x=>x.id===g("tCf").value));S.q=[];S.cont=nextTurn;startConflict(c);});
}
/* ============ boot ============ */
function boot(){
  story=$("#story");
  try{localStorage.setItem("t_","1");localStorage.removeItem("t_");}catch(e){storageOK=false;}
  loadP();
  $("#storeWarn").textContent=storageOK?"":"Saving is blocked here: use Menu > Save code.";
  $("#bHow").onclick=()=>{if(P)openTutorial(false);};$("#bNotes").onclick=showNotes;$("#bLog").onclick=showLog;$("#bRead").onclick=readAloud;$("#bMenu").onclick=showMenu;
  $("#bTeacher").onclick=e=>{e.preventDefault();if(teacherOn){renderTeacher();return;}teacherLogin();};
  renderAll();
  if(!P)createChar();else title();
}
window.G={get S(){return S;},get P(){return P;},NARR,fos,arrive,openTutorial,makeWheel,beginTurn,finale,startRun,title,showEvent,EV,INTER,CONF,applyFx,recallScreen,startConflict,showInter,startDay};
window.addEventListener("load",boot);
</script>
