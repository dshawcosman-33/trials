<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Trials</title>
<style>
:root{--teal:#1d9a8f;--tealD:#14736b;--coral:#e8624f;--coralD:#c24a39;--ink:#1c2b33;--paper:#f6f1e7;--card:#fffdf8;--line:#d9d2c3;--gray:#9aa3a8;--water:#2b8fd1;--fuel:#d9962b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Georgia,"Times New Roman",serif;color:var(--ink);background:var(--paper);font-size:17px}
body.large{font-size:20px}
body.contrast{--paper:#000;--card:#111;--ink:#fff;--line:#fff;--teal:#00e0cf;--coral:#ff8a75}
body.contrast .btn{color:#000}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
header{background:var(--ink);color:#fff;padding:6px 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:bold;letter-spacing:2px;font-size:1.15em}
.logo small{font-size:.6em;color:var(--coral);margin-left:4px}
#hdrinfo{font-size:.9em;color:#cfe6e3}
#meters{display:flex;gap:14px;align-items:center;font-size:.9em}
.spacer{flex:1}
.hbtn{background:#2d4350;color:#fff;border:1px solid #476273;border-radius:6px;padding:5px 10px;font:inherit;font-size:.8em;cursor:pointer}
.hbtn:hover{background:var(--teal)}
.pips{display:inline-flex;align-items:center;gap:3px}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:inline-block}
.eyes{background:var(--coral);color:#fff;padding:2px 8px;border-radius:10px;font-size:.8em}
main{display:grid;grid-template-columns:250px 1fr 250px;gap:10px;padding:10px;min-height:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto}
#story{padding:16px 22px}
#story h2{margin:0 0 8px;color:var(--tealD);font-size:1.5em}
.txt{line-height:1.5;margin-bottom:10px}
.notes{background:#eef7f6;border-left:4px solid var(--teal);padding:6px 10px;margin:6px 0;font-size:.92em;border-radius:4px}
.act{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;text-align:left;cursor:pointer;font-size:.98em}
.btn:hover{background:var(--tealD)}
.btn.coral{background:var(--coral)}
.btn.coral:hover{background:var(--coralD)}
.btn.grey{background:#6b7a82}
.btn.small{padding:5px 10px;font-size:.85em}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tag{display:inline-block;background:rgba(255,255,255,.25);border-radius:10px;padding:1px 8px;font-size:.8em;margin-left:6px}
.tag.danger{background:#7a1010;color:#fff}
.tag.unlock{background:#f0c040;color:#222}
.dice{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px}
.wheel{width:200px;height:200px;flex:none}
.wheel svg{width:100%;height:100%;display:block}
.wheel .rot{transform-origin:115px 115px}
.turnlist{list-style:none;margin:0;padding:0;font-size:.88em}
.turnlist li{padding:2px 5px;border-radius:4px;margin-bottom:1px}
.turnlist li.now{background:var(--teal);color:#fff;font-weight:bold}
.turnlist li.done{color:#8a959b}
.turnlist li.drop{font-size:.82em;color:var(--water);padding-left:16px;font-weight:bold}
.turnlist li.drop.past{color:#8a959b;font-weight:normal}
.warn{background:#fde8e4;border:2px solid var(--coral);color:#7a1f12;padding:6px 8px;border-radius:6px;font-size:.85em;margin-top:6px}
.tut h3{margin:0 0 6px;color:var(--tealD)}
.tut .ex{background:var(--card);border:2px dashed var(--teal);border-radius:8px;padding:8px 10px;margin:8px 0}
.tut .ex p{margin:4px 0}
.tut .pg{font-size:.8em;color:#667;margin-bottom:6px}
.tut ul{margin:4px 0 8px 18px;padding:0}
.tut li{margin-bottom:3px;line-height:1.4}
.good{color:var(--tealD);font-weight:bold}
.bad{color:var(--coralD);font-weight:bold}
body.contrast .notes{background:#0b2a28;color:#fff}
body.contrast .warn{background:#3a0f0a;color:#fff}
body.contrast .tag.unlock{color:#222}
body.contrast .tut .ex{border-color:#00e0cf}
.die{width:84px;height:84px;display:flex;align-items:center;justify-content:center;font-size:2.4em;font-weight:bold;background:var(--ink);color:#fff;border-radius:14px;flex:none}
.die.crit{background:#c9a400}
.die.fumble{background:#7a1010}
.calc{font-size:.95em;line-height:1.45}
.res{font-weight:bold;font-size:1.1em;margin-top:4px}
.res.pass,.res.crit{color:var(--tealD)}
.res.fail,.res.fumble{color:var(--coralD)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.card{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--card);font-size:.9em}
.card h4{margin:0 0 4px;color:var(--tealD)}
.stat{display:flex;justify-content:space-between;font-size:.9em;padding:1px 0}
.small{font-size:.85em}
.mut{color:#667}
.sym{font-size:1.6em;padding:6px 12px}
footer{padding:4px 12px;font-size:.75em;display:flex;gap:12px;color:#667}
footer a{color:#667}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
.modal.on{display:flex}
.mbox{background:var(--card);border-radius:12px;padding:18px;max-width:640px;width:92%;max-height:86vh;overflow:auto;border:2px solid var(--teal)}
.mbox h3{margin-top:0;color:var(--tealD)}
textarea,input[type=text],input[type=password],input[type=number],select{font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;width:100%}
#teacher{position:fixed;right:0;top:0;bottom:0;width:430px;background:#0f1a20;color:#cfe8e4;overflow:auto;padding:10px;font:12px/1.4 monospace;display:none;z-index:40}
#teacher h4{margin:10px 0 4px;color:#f0c040}
#teacher button{background:#1d9a8f;color:#fff;border:0;border-radius:4px;padding:3px 8px;margin:2px;cursor:pointer;font:12px monospace}
#teacher input,#teacher select{width:auto;font:12px monospace;padding:2px;background:#1b2b33;color:#fff;border:1px solid #476273}
#teacher .dbg{max-height:220px;overflow:auto;background:#0a1216;padding:4px;border:1px solid #234}
#teacher table{border-collapse:collapse;width:100%}
#teacher td{padding:1px 4px;border-bottom:1px solid #234;vertical-align:top}
svg text{font-family:Georgia,serif}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="logo">THE TRIALS<small>BETA 0.2</small></div>
  <div id="hdrinfo"></div>
  <div id="meters"></div>
  <div class="spacer"></div>
  <button class="hbtn" id="bHow">How to Play</button>
  <button class="hbtn" id="bNotes">Field Notes</button>
  <button class="hbtn" id="bLog">Run Log</button>
  <button class="hbtn" id="bRead">Read aloud</button>
  <button class="hbtn" id="bMenu">Menu</button>
</header>
<main>
  <aside class="panel" id="left"><div id="mapwrap"></div><div id="mapnote" class="small mut"></div></aside>
  <section class="panel" id="story"></section>
  <aside class="panel" id="right"></aside>
</main>
<footer><a href="#" id="bTeacher">Teacher Build</a><span>The Trials Beta 0.2</span><span id="storeWarn"></span></footer>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div id="teacher"></div>

<script>
"use strict";
/* ============ utilities ============ */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function btn(label,fn,cls){const b=el("button","btn"+(cls?" "+cls:""),label);b.onclick=()=>{if(b.disabled)return;fn();};return b;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng=Math.random;
const rnd=()=>rng();
const ri=n=>Math.floor(rnd()*n);
const pick=a=>a[ri(a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const d20=()=>1+ri(20);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const FAST=()=>!!window.__FAST;

/* ============ constants ============ */
const SN={sp:"Speed",st:"Strength",pe:"Perception",wi:"Wits",sa:"Stamina"};
const SK=["sp","st","pe","wi","sa"];
const DC={E:8,M:11,H:14,V:17};
const DN={E:"Easy",M:"Medium",H:"Hard",V:"Very Hard"};
const LOC={DEP:{n:"The Depot",x:130,y:130},PIN:{n:"Whisper Pines",x:50,y:100},LAK:{n:"Clearwater Lake",x:205,y:245},RID:{n:"Ridgeback",x:210,y:100},MSH:{n:"Mistmarsh",x:55,y:245},BEA:{n:"Beacon Hill",x:130,y:30}};
const ADJ={DEP:["PIN","LAK","RID"],PIN:["DEP","LAK","MSH","RID","BEA"],LAK:["DEP","PIN","MSH"],RID:["DEP","PIN","BEA"],MSH:["PIN","LAK"],BEA:["PIN","RID"]};
const TERR={DEP:"any",PIN:"forest",LAK:"water",RID:"rock",MSH:"marsh",BEA:"any"};
const TURNN={0:"The Start",1:"Morning",2:"Action turn",3:"Midday",4:"Action turn",5:"Evening"};
const DEF={stealth:"wi",woodcraft:"wi",foraging:"pe",waterwise:"pe",climbing:"st",tinkering:"wi",fishing:"wi",hunt:"pe",camp:"wi",conflict:"st"};
const KS={fishing:"waterwise"};
const SYM={sun:"\u2600\uFE0F Sun",wave:"\uD83C\uDF0A Wave",leaf:"\uD83C\uDF3F Leaf"};
const REG={
 "Timberline":{sp:2,st:4,pe:3,wi:2,sa:3,sk:["woodcraft","climbing"],aff:"ff",home:"Logging and forest towns",perk:"Axe Hands: a hatchet gives +3 instead of +2"},
 "Highmeadow":{sp:4,st:2,pe:3,wi:2,sa:3,sk:["woodcraft","foraging"],aff:"ff",home:"Open grassland herding",perk:"Long Strider: your first Speed roll each day gets +2"},
 "Greenhollow":{sp:2,st:3,pe:3,wi:3,sa:3,sk:["foraging","waterwise"],aff:"ft",home:"Farm valleys",perk:"Seed Sense: a failed Foraging check only costs 1 Fuel and never Recalls you"},
 "Harbor Reach":{sp:3,st:2,pe:3,wi:3,sa:3,sk:["waterwise","stealth"],aff:"ft",home:"Fishing and boat towns",perk:"Tide Reader: +2 on every check at the Lake"},
 "Gearworks":{sp:3,st:2,pe:2,wi:5,sa:2,sk:["stealth","tinkering"],aff:"ss",home:"Machine and repair city",perk:"Spare Parts: you carry a free Tinker Kit that uses no slot"},
 "Stonefield":{sp:2,st:4,pe:2,wi:2,sa:4,sk:["tinkering","climbing"],aff:"ss",home:"Quarry and mining town",perk:"Iron Lungs: once per run, reroll a failed Strength or Stamina check"}
};
const REGN=["Timberline","Highmeadow","Greenhollow","Harbor Reach","Gearworks","Stonefield"];
const NPC={
 Kit:{r:"Greenhollow",aff:"ft",th:12,spec:"foraging",look:"Young, cheerful, always sharing snacks",sp:"Foraging checks",weak:"Kit avoids fights and gives way when you speak kindly."},
 Bram:{r:"Stonefield",aff:"ss",th:18,spec:"st",look:"Big, quiet, protective",sp:"Strength checks",weak:"Bram tires on long chases."},
 Wren:{r:"Highmeadow",aff:"ff",th:16,spec:"pe",look:"Watchful scout who rarely speaks",sp:"Perception checks",weak:"Wren is weaker on low ground."},
 Dax:{r:"Gearworks",aff:"ss",th:14,spec:"tinkering",look:"Charming, talks fast, always has an angle",sp:"Tinkering checks",weak:"Dax relies on gadgets that can be jammed."},
 Orla:{r:"Harbor Reach",aff:"ft",th:15,spec:"waterwise",look:"Calm navigator and trader",sp:"Waterwise checks",weak:"Orla would rather trade than fight."},
 Ines:{r:"Timberline",aff:"ff",th:17,spec:null,look:"Ambitious and competitive",sp:"none",weak:"Ines rushes in too fast and overreaches."}
};
const CLUES={
 Steadfast:["{n} splits the food evenly, then slides the larger share toward you.","{n} keeps watch while you sleep and wakes you gently.","{n} tells you the truth even when it is awkward."],
 Fickle:["{n} checks their own pouch before yours.","{n} keeps glancing at the tree line, as if planning an exit.","{n} is cheerful, but only while things are going well."],
 Opportunist:["{n} asks twice which route you plan to take to the Beacon.","{n} studies your gear a little too closely.","{n} always seems to stand between you and the exit."]
};
const ITEMS={
 hatchet:{n:"Hatchet",b:["woodcraft","camp","conflict"],d:"+2 on shelter, fire, wood and conflict checks"},
 bow:{n:"Sim Bow",b:["hunt","conflict"],d:"+2 on hunting and conflict checks"},
 knife:{n:"Sim Knife",b:["conflict","rope"],d:"+2 on conflict checks"},
 net:{n:"Snag Net",b:["fishing","trapping"],d:"+2 on fishing and trapping"},
 rope:{n:"Climbing Rope",b:["climbing"],d:"+2 on Climbing, auto-passes some climbs"},
 filter:{n:"Water Filter",b:["waterwise"],d:"Water from any source is safe, +2 on Waterwise"},
 canteen:{n:"Canteen",b:[],d:"Your Water can hold 4"},
 card:{n:"Forager's Card",b:["foraging"],d:"+2 on Foraging, failed berries only cost 1 Fuel"},
 tinker:{n:"Tinker Kit",b:["tinkering"],d:"+2 on Tinkering checks"},
 cloak:{n:"Camo Cloak",b:["stealth"],d:"+2 on Stealth"},
 wrap:{n:"Shelter Wrap",b:["woodcraft","camp"],d:"+2 on camp checks"},
 patch:{n:"Recovery Patch",b:[],d:"One use: cancels one Recall"},
 cord:{n:"Cord",b:["climbing","camp"],bonus:1,d:"+1 on Climbing and camp checks"},
 trap:{n:"Trap",b:["trapping","hunt"],bonus:1,d:"+1 on hunting and trapping"}
};
const GEAR=["hatchet","bow","knife","net","rope","filter","canteen","card","tinker","cloak","wrap","patch"];
const INS={
 snares:"Snares work best near streams.",pinsnares:"Whisper Pines hides old snares.",flood:"Mistmarsh will flood overnight into Day 2.",
 schedule:"The Overseers schedule an event each morning.",beacon:"The Beacon sits above Pines and Ridgeback.",collapse:"The Depot collapses at dawn on Day 3.",
 roamer:"Roamers follow lures and lose interest when you are quiet.",berries:"Berry bushes with glossy leaves in threes are unsafe (fictional clue).",
 hazard:"Rocky trails hide falling rocks and trip wires. Watch your footing."
};
const GEARNOTE="";
/* ============ content: main events ============ */
const EV={};
function K(l,st,d,k,p,f,o){const o2=Object.assign({},o||{});if(f==="R"){o2.d=1;f=["recall"];}return{l,st,d:d||null,k:k||"",p:p||[],f:f||[],o:o2};}
function E(id,t,s,c){EV[id]={t,s,c,id};}

/* Day 1 standard */
E("D1-DEP-A","Crate Scramble","The dome is packed. Three contenders argue over a half-open crate while others dart between the stacks.",[
 K("Dive for the crate","sp","M","",["item","N+1"],["N+1"],{cf:["recall"]}),
 K("Trade for supplies","wi","M","",["trade"],[]),
 K("Slip out a side ramp",null,"E","stealth",["move","N-1"],["move","N+1"])]);
E("D1-DEP-B","Crowded Dusk","Dusk. Rivals settle among the crates, whispering. It is warm in the dome, but loud.",[
 K("Camp in the supply tunnels",null,"M","stealth",["rested","item"],["N+2"]),
 K("Trade information with a tired NPC","wi","E","",["W+1","hint"],["N+1"]),
 K("Leave for Whisper Pines in the dusk","sp","E","",["move:PIN"],["move:PIN","N+1"])]);
E("D1-PIN-A","Snare Line","Among the roots, you find a line of simple snares left by an earlier contender.",[
 K("Reset and check the snares","wi","M","",["F+1","ins:snares"],["N+1"]),
 K("Take only the cord",null,null,"",["item:cord"],[]),
 K("Leave them and move on quietly",null,null,"",["N-1"],[])]);
E("D1-PIN-B","Hollow Log Shelter","A huge fallen tree has a dry hollow. Night is close.",[
 K("Build up the hollow into a shelter","wi","E","camp",["rested","N-1"],[],{tx:[0,"A cold night. No bonus."]}),
 K("Climb a tree and sleep in the branches","st","M","",["rested"],[],{cf:["recall"]}),
 K("Keep moving by moonlight","pe","M","",["move"],["N+1"])]);
E("D1-LAK-A","Shoreline Glint","The lake shines through the trees. Water at last, but the shore is open ground and fresh footprints cross the sand.",[
 K("Fill up fast at the shore","sp","E","",["Wfull","N+1"],["W+1","N+2"]),
 K("Scout the tree line first","pe","M","",["hint","Wfull"],["Wfull","N+1"]),
 K("Fish with an improvised line","wi","M","fishing",["F+1","W+1"],["N+1"])]);
E("D1-LAK-B","Lakeside Camp","Mist rolls off the water. Voices drift from the far shore.",[
 K("Camp on a small sandbar","sa","M","",["rested","N-1"],[]),
 K("Purify water for tomorrow","wi","E","waterwise",["W+1"],[],{auto:"filter"}),
 K("Signal a passing NPC to join camp","wi","M","",["ally","F+1"],["N+1"])]);
E("D1-RID-A","The Lookout","A steep climb leads to a ledge that overlooks the whole Basin.",[
 K("Climb to the ledge","st","M","climbing",["ins:flood","hint"],[],{cf:["recall"]}),
 K("Search the loose rock below","pe","M","",["item"],["N+1"]),
 K("Shelter under an overhang and rest",null,null,"",["rested"],[])]);
E("D1-RID-B","Cave Camp","A dry cave with an odd blue glow at the back.",[
 K("Camp deep inside","wi","M","camp",["rested","N-1"],[]),
 K("Camp at the entrance with a small fire","wi","E","woodcraft",["rested","N+1"],["N+2"]),
 K("Investigate the glowing wall","wi","M","tinkering",["ins:schedule","reveal"],["N+2"])]);
E("D1-MSH-A","Berry Thicket","Fat red and blue berries hang over black mud. Your Fuel is low. The leaves on the blue bush grow in threes.",[
 K("Eat the blue berries","pe","M","foraging",["F+2"],["recall"],{lr:"berries"}),
 K("Eat the red berries","pe","E","foraging",["F+1"],[]),
 K("Skip them",null,null,"",[],[])]);
E("D1-MSH-B","Fog Camp","Fog thickens until you can barely see your hands. Pale lights bob in the reeds.",[
 K("Camp on a dry hummock","pe","M","",["rested"],[]),
 K("Follow the pale lights","wi","H","",["item","W+1"],["N+1"],{cf:["recall"]}),
 K("Build a reed raft to sleep on the water",null,"M","tinkering",["rested","N-2","flag:raft"],[]),
 K("Leave the marsh before the flood",null,null,"",["move:PIN|LAK","rested"],[],{req:"ins:flood"})]);
/* Day 1 hard */
E("D1-DEP-AH","Crate Stampede","The Overseers dump a pile of crates in the middle of the dome, and every contender surges toward it.",[
 K("Dive into the pile","sp","H","",["item","item","N+2"],"R"),
 K("Grab the nearest crate and roll away","st","M","",["item","N+1"],["N+1"]),
 K("Watch from the dome ledge","pe","M","",["hint","hint"],["N+1"])]);
E("D1-DEP-BH","Tunnel Sweep","A patrol of rivals sweeps the supply tunnels at dusk, checking every corner.",[
 K("Hide in the crate stacks",null,"H","stealth",["rested","item"],"R"),
 K("Slip out through a vent","st","M","",["move"],["N+2"]),
 K("Talk your way past the patrol","wi","H","",["hint"],["conflict"])]);
E("D1-PIN-AH","Trapper's Maze","Snares and trip wires fill the trees. This part of the forest was set up as a trap field.",[
 K("Sprint straight through","sp","H","",["move:LAK|RID"],"R"),
 K("Pick through carefully","pe","H","",["item:trap","F+1"],["N+2"]),
 K("Walk around the edge","sa","M","",[],["W-1"])]);
E("D1-PIN-BH","Stinging Night","A swarm of simulated stinging flies nests right where you meant to camp.",[
 K("Sleep in the cold stream bed","sa","H","",["rested","N-1"],"R"),
 K("Smoke them out",null,"H","woodcraft",["rested","N+1"],["N+2"]),
 K("Flee into the dark","sp","M","",["move"],["N+2"])]);
E("D1-LAK-AH","Crowded Shore","Four rivals crowd the shoreline, fighting for water.",[
 K("Rush to the water","sp","H","",["Wfull","N+2"],"R"),
 K("Wait for the crowd to thin","wi","M","",["W+2","N+1"],["conflict"]),
 K("Swim to a quiet cove","sa","H","",["Wfull","N-1"],["lose-item"])]);
E("D1-LAK-BH","Mist and Current","A thick mist covers the lake and the current tugs hard at the shore.",[
 K("Cross to the island","sa","H","",["rested","N-2"],"R"),
 K("Build a driftwood windbreak",null,"H","woodcraft",["rested","N-1"],[]),
 K("Light a signal fire for an ally","wi","M","woodcraft",["ally","N+2"],["N+3"])]);
E("D1-RID-AH","Crumbling Ledge","The ledge route to the lookout is crumbling under your feet.",[
 K("Rush up the ledge","sp","H","climbing",["ins:flood","hint"],"R"),
 K("Climb the safer chimney","st","H","climbing",["ins:flood"],[]),
 K("Scout from below","pe","H","",["ins:flood"],[])]);
E("D1-RID-BH","Dripping Cave","The cave roof drips and groans. Small stones fall.",[
 K("Camp deep inside","wi","H","camp",["rested","N-1"],"R"),
 K("Prop the roof with branches","st","M","",["rested"],[]),
 K("Find another cave","pe","H","",["rested","N-2"],["N+2"])]);
E("D1-MSH-AH","Poison Thicket","Berries of every colour crowd the bushes, and they all look alike. Your Fuel is low.",[
 K("Eat the largest berries","pe","H","foraging",["F+2","ins:berries"],"R",{lr:"berries"}),
 K("Boil leaves for tea","wi","M","",["F+1"],[]),
 K("Fish in the muck","wi","M","fishing",["F+1"],["N+1"])]);
E("D1-MSH-BH","Sinking Ground","The marsh softens under your feet as night falls.",[
 K("Cross the soft ground to dry land","sp","H","",["rested"],"R"),
 K("Stay on the hummock","pe","H","",["rested"],["N+1"]),
 K("Build a reed raft",null,"H","tinkering",["rested","N-2","flag:raft"],[]),
 K("Leave the marsh before the flood",null,null,"",["move:PIN|LAK","rested"],[],{req:"ins:flood"})]);
/* Day 2 standard */
E("D2-DEP-A","Picked-Over Dome","Most crates are empty. One has a keypad with three glowing symbols: a sun, a wave and a leaf.",[
 K("Crack the keypad","wi","H","tinkering",["item:rare","code"],["N+2"]),
 K("Scavenge the leftovers","pe","E","",["F+1"],[]),

/* ============ narrative system ============ */
const NARR={ev:{},inter:{},conf:{},cfo:{},trav:{},travday:{},loc:{},act:{},start:{},misc:{},tut:{}};
function paras(t){return String(t==null?"":t).split(/\n\n/).filter(x=>x.trim()).map(x=>`<p>${esc(x.trim())}</p>`).join("");}
function seenBefore(key){if(!P)return false;if(!P.seen)P.seen={};if(P.seen[key])return true;P.seen[key]=1;saveP();return false;}
/* first time: full text. Later visits: the short reminder. Tracked per character in P.seen */
function fos(key,long,short){const s=seenBefore(key);if(!long&&!short)return"";return paras(s&&short?short:(long||short));}
const sg=n=>n>=0?"+"+n:""+n;
function stampNow(){return `Day ${S.day} ${S.turn===0?"Start":(S.day===3&&S.turn===5?"Finale":TURNN[S.turn])}${S.loc?", "+LOC[S.loc].n:""}`;}
function logM(t){if(S)S.log.push({k:"m",t});}
function logW(t){if(S)S.log.push({k:"w",t});}

/* ============ TUTORIAL (How to Play) ============ */
function mockBonus(st,k){return effStat(st)+((k&&P&&REG[P.reg].sk.includes(KS[k]||k))?3:0);}
function spinInto(box,need,bonus,cb,forced){
  box.innerHTML="";
  const roll=forced||d20(),tot=roll+bonus,res=roll===20?"crit":roll===1?"fumble":tot>=need?"pass":"fail";
  const wb=el("div","dice wheelbox"),calc=el("div","calc","<i>Spinning... (click the wheel to skip)</i>");
  const W=makeWheel(roll);wb.append(W.el,calc);box.append(wb);
  W.spin(()=>{sfx(res);calc.innerHTML=resultExplain(roll,bonus,tot,need,res)+(res==="crit"?"<div class='notes'>In a real run you would also gain Audience Favour.</div>":"");if(cb)cb({roll,tot,res});});
}
function tutFree(c,need,bonus,label,rig){
  let n=0;
  const box=el("div"),b=btn("Spin the wheel!",()=>{b.textContent="Spinning...";b.disabled=true;
    let f=null;if(rig&&n<rig.length){f=typeof rig[n]==="function"?rig[n]():rig[n];}n++;
    spinInto(box,need,bonus,()=>{b.disabled=false;b.textContent="Spin again (just for practice)";},f);});
  const ex=el("div","ex",`<b>${label}</b><br>Need <b>${need}</b>. Your stats add <b>${sg(bonus)}</b>.`);
  const wrap=el("div","act");wrap.append(b);
  c.append(ex,wrap,box);
}
function tutQuiz(c,q,opts,correct,why){
  const qd=el("div","ex",`<b>${q}</b>`),area=el("div","act"),fb=el("div","");
  opts.forEach((o,i)=>area.append(btn(o,()=>{
    if(i===correct){fb.innerHTML=`<div class="good">Correct! ${why}</div>`;area.querySelectorAll("button").forEach(x=>x.disabled=true);}
    else fb.innerHTML=`<div class="bad">Not quite. Try again.</div>`;
  },"grey")));
  c.append(qd,area,fb);
}
function tutScenario(c,sc){
  c.innerHTML="";
  c.append(el("div","ex",paras(sc.text)));
  const area=el("div","act"),out=el("div");
  const again=()=>{const b=btn("Try a different choice",()=>tutScenario(c,sc),"coral small");out.append(b);};
  sc.opts.forEach(o=>{
    const lab=`${esc(o.l)} `+(o.need?`<span class="tag">${o.stat}, need ${o.need} (you add ${sg(o.bonus)})</span>`:`<span class="tag">No roll</span>`)+(o.danger?' <span class="tag danger">Danger</span>':"");
    area.append(btn(lab,()=>{
      area.querySelectorAll("button").forEach(b=>b.disabled=true);
      if(!o.need){out.innerHTML=paras(o.win)+`<div class="notes">${esc(o.real)}</div>`;again();return;}
      const box=el("div");out.append(box);
      spinInto(box,o.need,o.bonus,r=>{
        const good=r.res==="pass"||r.res==="crit";
        const t=el("div","");
        t.innerHTML=paras(good?o.win:o.lose)+`<div class="notes">${esc(good?o.realWin:o.realLose)}</div>`;
        out.append(t);again();
      });
    }));
  });
  c.append(area,out);
}
const TUT=[
 c=>{c.innerHTML=`<h3>Welcome to the Trials</h3>
  <p>You are a <b>contender</b> in the Trials, a giant survival game played inside a huge, machine-made arena called <b>the Basin</b>. The rain, the fire, the fog and even the "Roamers" (robot animals) are all made by machines. <b>Nobody gets hurt.</b></p>

 c=>{c.innerHTML=`<h3>Water and Fuel</h3>

 c=>{c.innerHTML=`<h3>How a day works</h3>

 c=>{const wi=mockBonus("wi");
  c.innerHTML=`<h3>Checks: the Need number and the wheel</h3>

 c=>{c.innerHTML=`<h3>Your backpack</h3>

 c=>{c.innerHTML=`<h3>Allies, Noticed, Insights and Training</h3>
